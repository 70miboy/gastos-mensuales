<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos Mensuales - Tomás Norman</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  /* HEADER */
  .header { background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%); border-bottom: 1px solid #2d3748; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .header h1 { font-size: 1.35rem; font-weight: 700; color: #f7fafc; }
  .header h1 span { color: #63b3ed; }
  .last-update { font-size: 0.74rem; color: #718096; margin-top: 3px; }
  .header-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

  .btn-action { background: #2d3748; border: 1px solid #4a5568; color: #a0aec0; padding: 7px 14px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-action:hover { background: #3d4a5c; color: #e2e8f0; }
  .btn-action.primary { background: #2b6cb0; border-color: #3182ce; color: #bee3f8; }
  .btn-action.primary:hover { background: #2c5282; color: #fff; }

  /* TABS */
  .tabs { display: flex; border-bottom: 1px solid #2d3748; background: #1a1f2e; padding: 0 24px; }
  .tab { padding: 11px 18px; cursor: pointer; font-size: 0.84rem; color: #718096; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .tab.active { color: #63b3ed; border-bottom-color: #63b3ed; }
  .tab:hover { color: #a0aec0; }

  /* MAIN */
  .main { padding: 20px 24px; max-width: 1260px; margin: 0 auto; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* CARDS */
  .summary-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 10px; padding: 14px 16px; }
  .card-label { font-size: 0.71rem; text-transform: uppercase; letter-spacing: 0.05em; color: #718096; margin-bottom: 7px; }
  .card-value { font-size: 1.45rem; font-weight: 700; }
  .card-value.red { color: #fc8181; }
  .card-value.green { color: #68d391; }
  .card-value.yellow { color: #f6e05e; }
  .card-value.blue { color: #63b3ed; }
  .card-sub { font-size: 0.74rem; color: #718096; margin-top: 4px; }

  /* PROGRESS */
  .progress-section { margin-bottom: 20px; }
  .progress-bar-outer { background: #2d3748; border-radius: 8px; height: 9px; overflow: hidden; margin-top: 7px; }
  .progress-bar-inner { height: 100%; border-radius: 8px; background: linear-gradient(90deg, #48bb78, #68d391); transition: width 0.5s; }

  /* FILTERS */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 13px; border-radius: 20px; border: 1px solid #2d3748; background: transparent; color: #718096; font-size: 0.77rem; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active { background: #1a2c4e; border-color: #63b3ed; color: #63b3ed; }
  .filter-btn:hover { border-color: #63b3ed; color: #63b3ed; }

  /* TABLE */
  .expense-table { width: 100%; border-collapse: separate; border-spacing: 0 3px; }
  .expense-table th { text-align: left; font-size: 0.69rem; text-transform: uppercase; color: #4a5568; padding: 5px 10px; letter-spacing: 0.05em; }
  .expense-row { background: #1a1f2e; transition: background 0.15s; }
  .expense-row:hover { background: #1e2535; }
  .expense-row td { padding: 9px 10px; font-size: 0.86rem; border-top: 1px solid #2d3748; border-bottom: 1px solid #2d3748; vertical-align: middle; }
  .expense-row td:first-child { border-left: 1px solid #2d3748; border-radius: 8px 0 0 8px; padding-left: 13px; }
  .expense-row td:last-child { border-right: 1px solid #2d3748; border-radius: 0 8px 8px 0; }
  .expense-row.paid-row { opacity: 0.75; }
  .expense-row.paid-row:hover { opacity: 1; }

  /* BADGES */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .badge-paid { background: #1c4532; color: #68d391; }
  .badge-overdue { background: #451a20; color: #fc8181; animation: pulse 2s infinite; }
  .badge-urgent { background: #44271a; color: #f6ad55; }
  .badge-soon { background: #3d3d1a; color: #f6e05e; }
  .badge-pending { background: #1a2535; color: #718096; }
  .badge-nodata { background: #1a1a2e; color: #7c6fcd; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

  .days-chip { font-size: 0.71rem; padding: 2px 7px; border-radius: 11px; }
  .days-red { background:#451a20;color:#fc8181;font-weight:700; }
  .days-orange { background:#44271a;color:#f6ad55;font-weight:700; }
  .days-yellow { background:#3d3d1a;color:#f6e05e; }
  .days-green { background:#1c4532;color:#68d391; }

  .cat-tag { font-size: 0.67rem; padding: 2px 6px; border-radius: 5px; }
  .cat-tarjeta { background:#1a2c4e;color:#63b3ed; }
  .cat-impuesto { background:#2d1a4e;color:#b794f4; }
  .cat-servicio { background:#1a3d2d;color:#68d391; }
  .cat-honorarios { background:#3d2d1a;color:#f6ad55; }
  .cat-expensas { background:#3d1a2d;color:#f687b3; }
  .cat-salud { background:#1a3d3d;color:#76e4f7; }
  .cat-suscripcion { background:#2d3d1a;color:#9ae6b4; }
  .cat-cooperativa { background:#3d3d1a;color:#f6e05e; }

  .amount { font-weight: 600; font-variant-numeric: tabular-nums; }
  .amount-unknown { color: #4a5568; font-style: italic; font-size: 0.79rem; cursor: pointer; }
  .amount-unknown:hover { color: #63b3ed; }
  .paid-amount { color: #68d391; font-weight: 600; }

  .notes-text { font-size: 0.73rem; color: #4a5568; max-width: 210px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

  .highlight-row td { background: #2d1a1a !important; }

  /* EDITABLE FIELDS */
  .editable { cursor: pointer; border-bottom: 1px dashed #4a5568; padding: 1px 3px; transition: all 0.15s; }
  .editable:hover { border-bottom-color: #63b3ed; color: #63b3ed; }

  /* ACTION BUTTONS */
  .btn-pagar { background: transparent; border: 1px solid #4a5568; color: #718096; padding: 4px 11px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .btn-pagar:hover { border-color: #63b3ed; color: #63b3ed; background: #1a2c4e22; }
  .btn-edit { background: transparent; border: 1px solid #4a5568; color: #718096; padding: 4px 11px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .btn-edit:hover { border-color: #f6ad55; color: #f6ad55; background: #44271a22; }
  .btn-pagado-edit { background: #1c4532; border: 1px solid #276749; color: #68d391; padding: 4px 11px; border-radius: 6px; font-size: 0.74rem; cursor: pointer; transition: all 0.18s; white-space: nowrap; }
  .btn-pagado-edit:hover { background: #22543d; }

  /* ALERT */
  .alert { background: #2d1a1a; border: 1px solid #742a2a; border-radius: 8px; padding: 11px 14px; margin-bottom: 10px; font-size: 0.82rem; color: #fc8181; display: flex; gap: 10px; align-items: flex-start; }
  .alert-warn { background: #2d241a; border-color: #744210; color: #f6ad55; }
  .alert-info { background: #1a2535; border-color: #2b4a7a; color: #63b3ed; }

  /* HISTORY */
  .history-month { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .history-month-header { padding: 13px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .history-month-header:hover { background: #1e2535; }
  .history-month-body { display: none; padding: 0 16px 16px; }
  .history-month-body.open { display: block; }
  .history-total { font-weight: 700; color: #63b3ed; }

  /* ====== MODAL ====== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
  .modal-overlay.hidden { display: none; }
  .modal-box { background: #1a1f2e; border: 1px solid #2d3748; border-radius: 14px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.7); }
  .modal-header { padding: 18px 20px 14px; border-bottom: 1px solid #2d3748; }
  .modal-header h3 { font-size: 1rem; font-weight: 700; color: #f7fafc; }
  .modal-header p { font-size: 0.78rem; color: #718096; margin-top: 4px; }
  .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-ref { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 13px; font-size: 0.82rem; color: #4a5568; }
  .modal-ref span { color: #63b3ed; font-weight: 600; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 0.77rem; color: #a0aec0; font-weight: 500; }
  .form-group input, .form-group textarea, .form-group select { background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; color: #e2e8f0; padding: 9px 12px; font-size: 0.88rem; outline: none; transition: border-color 0.2s; font-family: inherit; }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: #63b3ed; }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group input[type="number"] { font-variant-numeric: tabular-nums; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: space-between; border-top: 1px solid #2d3748; }
  .modal-footer-right { display: flex; gap: 10px; }
  .btn-cancel { background: transparent; border: 1px solid #2d3748; color: #718096; padding: 8px 16px; border-radius: 8px; font-size: 0.83rem; cursor: pointer; }
  .btn-cancel:hover { border-color: #4a5568; color: #a0aec0; }
  .btn-confirm { background: #276749; border: 1px solid #38a169; color: #f0fff4; padding: 8px 18px; border-radius: 8px; font-size: 0.83rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn-confirm:hover { background: #2f855a; }
  .btn-anular { background: transparent; border: 1px solid #742a2a; color: #fc8181; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
  .btn-anular:hover { background: #451a20; }
  .btn-danger { background: #742a2a; border: 1px solid #9b2c2c; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
  .btn-danger:hover { background: #9b2c2c; }

  .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: #718096; margin: 18px 0 8px; }

  /* CONNECTION STATUS */
  .conn-status { font-size: 0.71rem; padding: 3px 8px; border-radius: 10px; }
  .conn-ok { background: #1c4532; color: #68d391; }
  .conn-off { background: #451a20; color: #fc8181; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: #4a5568; font-size: 0.9rem; }
  .loading::after { content: '...'; animation: dots 1.5s infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Gastos Mensuales <span>· Tomás Norman</span></h1>
    <div class="last-update" id="last-update">Cargando...</div>
  </div>
  <div class="header-actions">
    <span class="conn-status conn-off" id="conn-status">Sin conexión</span>
    <button class="btn-action primary" onclick="openNuevoGastoModal()">+ Nuevo gasto</button>
    <button class="btn-action" onclick="refreshData()">🔄</button>
    <div style="font-size:1.7rem;">💰</div>
  </div>
</div>

<!-- TABS -->
<div class="tabs" id="tabs-bar"></div>

<div class="main" id="main-content">
  <div class="loading" id="loading-msg">Cargando datos</div>
</div>

<!-- ====== MODAL EDITAR PAGO ====== -->
<div class="modal-overlay hidden" id="modal-editar" onclick="if(event.target===this)closeModal('modal-editar')">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="editar-titulo">Editar gasto</h3>
      <p id="editar-subtitulo"></p>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Monto facturado ($)</label>
          <input type="number" id="editar-monto" placeholder="Ej: 244709" min="0" step="1" />
        </div>
        <div class="form-group">
          <label>Pago mínimo ($)</label>
          <input type="number" id="editar-minimo" placeholder="Opcional" min="0" step="1" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Vencimiento</label>
          <input type="date" id="editar-vencimiento" />
        </div>
        <div class="form-group">
          <label>Fuente</label>
          <input type="text" id="editar-fuente" placeholder="Ej: gmail, manual" />
        </div>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <textarea id="editar-notas" placeholder="Detalles adicionales..."></textarea>
      </div>

      <hr style="border:none;border-top:1px solid #2d3748;margin:4px 0;">
      <div class="section-title">Registrar pago</div>

      <div class="form-row">
        <div class="form-group">
          <label>¿Pagado?</label>
          <select id="editar-pagado">
            <option value="false">No</option>
            <option value="true">Sí</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de pago</label>
          <input type="date" id="editar-pagado-fecha" />
        </div>
      </div>
      <div class="form-group">
        <label>Monto pagado ($)</label>
        <input type="number" id="editar-pagado-monto" placeholder="0" min="0" step="1" />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-anular" id="btn-anular" onclick="anularPago()" style="display:none;">✕ Anular pago</button>
      <div class="modal-footer-right">
        <button class="btn-cancel" onclick="closeModal('modal-editar')">Cancelar</button>
        <button class="btn-confirm" onclick="confirmEditar()">✓ Guardar</button>
      </div>
    </div>
  </div>
</div>

<!-- ====== MODAL NUEVO GASTO ====== -->
<div class="modal-overlay hidden" id="modal-nuevo" onclick="if(event.target===this)closeModal('modal-nuevo')">
  <div class="modal-box">
    <div class="modal-header">
      <h3>+ Nuevo gasto</h3>
      <p>Agregá un gasto que no está en la lista</p>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Nombre</label>
          <input type="text" id="nuevo-nombre" placeholder="Ej: Internet Claro" />
        </div>
        <div class="form-group">
          <label>ID (sin espacios)</label>
          <input type="text" id="nuevo-id" placeholder="Ej: internet_claro" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Categoría</label>
          <select id="nuevo-categoria">
            <option value="tarjeta">Tarjeta</option>
            <option value="impuesto">Impuesto</option>
            <option value="servicio" selected>Servicio</option>
            <option value="honorarios">Honorarios</option>
            <option value="expensas">Expensas</option>
            <option value="salud">Salud</option>
            <option value="suscripcion">Suscripción</option>
            <option value="cooperativa">Cooperativa</option>
          </select>
        </div>
        <div class="form-group">
          <label>Persona</label>
          <select id="nuevo-persona">
            <option value="Tomás">Tomás</option>
            <option value="Joana">Joana</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Monto ($)</label>
          <input type="number" id="nuevo-monto" placeholder="Opcional" min="0" step="1" />
        </div>
        <div class="form-group">
          <label>Vencimiento</label>
          <input type="date" id="nuevo-vencimiento" />
        </div>
      </div>
      <div class="form-group">
        <label>Notas</label>
        <input type="text" id="nuevo-notas" placeholder="Ej: Fibra 300Mbps · Vence día 10" />
      </div>
    </div>
    <div class="modal-footer">
      <div></div>
      <div class="modal-footer-right">
        <button class="btn-cancel" onclick="closeModal('modal-nuevo')">Cancelar</button>
        <button class="btn-confirm" onclick="confirmNuevoGasto()">✓ Crear gasto</button>
      </div>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let GASTOS_DATA = null;   // full gastos.json
let CONFIG_DATA = null;   // full config.json
let API_AVAILABLE = false;
let currentMonth = null;  // active tab month
let currentFilter = 'all';

const API_BASE = '';  // same origin

// ── DATE HELPERS ──
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function todayStr() { return new Date().toISOString().split('T')[0]; }
function currentMonthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
function nextMonthKey() {
  const d = new Date(); d.setMonth(d.getMonth()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

// ── API ──
async function apiGet(path) {
  const res = await fetch(API_BASE + path);
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}
async function apiPatch(mes, id, data) {
  const res = await fetch(`${API_BASE}/api/gasto/${mes}/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}
async function apiPost(path, data) {
  const res = await fetch(API_BASE + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

// ── FORMAT ──
function fmt(n) {
  if (n === null || n === undefined) return null;
  return '$ ' + Math.round(n).toLocaleString('es-AR');
}
function fmtDate(s) {
  if (!s) return null;
  const [y,m,d] = s.split('-');
  return `${d}/${m}`;
}
function fmtMonth(key) {
  const [y,m] = key.split('-');
  const names = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return `${names[parseInt(m)]} ${y}`;
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return Math.round((d - TODAY) / 86400000);
}
function getDaysBadge(days, paid) {
  if (paid) return `<span class="days-chip days-green">✓</span>`;
  if (days === null) return '';
  if (days < 0) return `<span class="days-chip days-red">${Math.abs(days)}d atrás</span>`;
  if (days === 0) return `<span class="days-chip days-red">HOY</span>`;
  if (days === 1) return `<span class="days-chip days-red">MAÑANA</span>`;
  if (days <= 3) return `<span class="days-chip days-orange">${days}d</span>`;
  if (days <= 10) return `<span class="days-chip days-yellow">${days}d</span>`;
  return `<span class="days-chip days-green">${days}d</span>`;
}
function getStatusBadge(p) {
  if (p.pagado === true) return `<span class="badge badge-paid">✓ Pagado</span>`;
  if (!p.vencimiento && !p.monto) return `<span class="badge badge-nodata">? Sin datos</span>`;
  const d = daysUntil(p.vencimiento);
  if (d !== null && d < 0) return `<span class="badge badge-overdue">⚠ Vencido</span>`;
  if (d !== null && d <= 1) return `<span class="badge badge-urgent">🔴 Urgente</span>`;
  if (d !== null && d <= 5) return `<span class="badge badge-urgent">🟠 Próximo</span>`;
  if (d !== null && d <= 10) return `<span class="badge badge-soon">🟡 Esta semana</span>`;
  return `<span class="badge badge-pending">● Pendiente</span>`;
}
function getCatTag(cat) {
  const L = { tarjeta:'Tarjeta', impuesto:'Impuesto', servicio:'Servicio', honorarios:'Honorarios', expensas:'Expensas', salud:'Salud', suscripcion:'Suscripción', cooperativa:'Cooperativa' };
  return `<span class="cat-tag cat-${cat}">${L[cat]||cat}</span>`;
}
function getGroup(p) {
  if (p.pagado === true) return 'pagado';
  if (!p.vencimiento && !p.monto) return 'sin_datos';
  return 'pendiente';
}

// ── GET CONFIG GASTOS LIST ──
function getConfigGastos() {
  if (CONFIG_DATA && CONFIG_DATA.gastos_recurrentes) {
    return CONFIG_DATA.gastos_recurrentes.map(g => ({
      id: g.id, nombre: g.nombre, cat: g.categoria === 'tarjeta_credito' ? 'tarjeta' : g.categoria,
      persona: g.persona
    }));
  }
  // Fallback
  return [
    { id:'ago_berli', nombre:'AGO Berli', cat:'honorarios', persona:'Tomás' },

}

// ── GET PAGO FOR MONTH + ID ──
function getPago(mesKey, gastoId) {
  if (GASTOS_DATA && GASTOS_DATA.pagos[mesKey] && GASTOS_DATA.pagos[mesKey][gastoId]) {
    return { ...GASTOS_DATA.pagos[mesKey][gastoId] };
  }
  return { vencimiento: null, monto: null, pagado: false, pagado_fecha: null, pagado_monto: null, notas: '', fuente: null };
}

// ── RENDER ──
function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  if (!GASTOS_DATA) return;

  const months = Object.keys(GASTOS_DATA.pagos).sort();
  const cur = currentMonthKey();
  const tabs = [];

  // Current month first
  if (GASTOS_DATA.pagos[cur]) {
    tabs.push({ key: cur, label: `🔴 ${fmtMonth(cur)}`, active: true });
    currentMonth = cur;
  } else {
    // If current month doesn't exist, use latest
    const latest = months[months.length - 1];
    tabs.push({ key: latest, label: `📅 ${fmtMonth(latest)}`, active: true });
    currentMonth = latest;
  }

  // Future months
  months.filter(m => m > currentMonth).forEach(m => {
    tabs.push({ key: m, label: `📅 ${fmtMonth(m)}`, active: false });
  });

  // Past months (historial)
  tabs.push({ key: '_historial', label: '📊 Historial', active: false });

  bar.innerHTML = tabs.map(t =>
    `<div class="tab${t.active?' active':''}" onclick="switchTab('${t.key}',this)">${t.label}</div>`
  ).join('');
}

function switchTab(key, el) {
  currentMonth = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderContent();
}

function renderContent() {
  const main = document.getElementById('main-content');
  document.getElementById('loading-msg')?.remove();

  if (currentMonth === '_historial') {
    renderHistorial(main);
    return;
  }

  const gastos = getConfigGastos();
  // Filter to only gastos that exist in this month's data
  const mesData = (GASTOS_DATA && GASTOS_DATA.pagos[currentMonth]) || {};

  // For future months, only show gastos that have entries
  const cur = currentMonthKey();
  const relevantGastos = currentMonth > cur
    ? gastos.filter(g => mesData[g.id])
    : gastos;

  // Sort
  const sorted = [...relevantGastos].sort((a, b) => {
    const pa = getPago(currentMonth, a.id), pb = getPago(currentMonth, b.id);
    if (pa.pagado === true && pb.pagado !== true) return 1;
    if (pa.pagado !== true && pb.pagado === true) return -1;
    const da = daysUntil(pa.vencimiento), db = daysUntil(pb.vencimiento);
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  });

  let totalKnown = 0, totalPaid = 0, countPaid = 0, countPending = 0, countNoData = 0;

  const rows = sorted.map(g => {
    const p = getPago(currentMonth, g.id);
    const group = getGroup(p);
    if (currentMonth === cur || currentMonth === nextMonthKey()) {
      if (currentFilter !== 'all' && group !== currentFilter) return '';
      if (p.monto) totalKnown += p.monto;
      if (p.pagado === true) { totalPaid += (p.pagado_monto || p.monto || 0); countPaid++; }
      else if (group === 'sin_datos') countNoData++;
      else countPending++;
    }

    const days = daysUntil(p.vencimiento);
    const isUrgent = days !== null && days <= 2 && p.pagado !== true;
    const isPaid = p.pagado === true;

    return `<tr class="expense-row${isUrgent?' highlight-row':''}${isPaid?' paid-row':''}">
      <td><strong>${g.nombre}</strong></td>
      <td>${getCatTag(g.cat)}</td>
      <td style="font-size:0.79rem;color:#a0aec0;">${g.persona}</td>
      <td style="font-size:0.82rem;font-weight:${isUrgent?'700':'400'};color:${isUrgent?'#fc8181':'inherit'}">
        ${p.vencimiento
          ? `<span class="editable" onclick="openEditar('${currentMonth}','${g.id}','vencimiento')">${fmtDate(p.vencimiento)}</span>`
          : `<span class="amount-unknown" onclick="openEditar('${currentMonth}','${g.id}','vencimiento')">Sin fecha</span>`}
      </td>
      <td>${getDaysBadge(days, isPaid)}</td>
      <td class="amount">
        ${p.monto
          ? `<span class="editable" onclick="openEditar('${currentMonth}','${g.id}','monto')">${fmt(p.monto)}</span>`
          : `<span class="amount-unknown" onclick="openEditar('${currentMonth}','${g.id}','monto')">— agregar</span>`}
      </td>
      <td>${getStatusBadge(p)}</td>
      <td style="font-size:0.8rem;color:#68d391;">${isPaid && p.pagado_fecha ? fmtDate(p.pagado_fecha) : '<span style="color:#4a5568;">—</span>'}</td>
      <td>${isPaid && p.pagado_monto ? `<span class="paid-amount">${fmt(p.pagado_monto)}</span>` : '<span style="color:#4a5568;">—</span>'}</td>
      <td>
        <button class="btn-edit" onclick="openEditar('${currentMonth}','${g.id}')">✏️ Editar</button>
      </td>
    </tr>`;
  }).join('');

  // Urgent alert
  const urgentes = sorted.filter(g => {
    const p = getPago(currentMonth, g.id);
    const d = daysUntil(p.vencimiento);
    return d !== null && d <= 3 && p.pagado !== true;
  });

  let alertHTML = '';
  if (urgentes.length > 0) {
    alertHTML = `<div class="alert">🚨 <div><strong>URGENTE:</strong> ${urgentes.map(g => {
      const p = getPago(currentMonth, g.id);
      const d = daysUntil(p.vencimiento);
      return `${g.nombre}${p.monto ? ' ' + fmt(p.monto) : ''}${d===0?' HOY':d===1?' MAÑANA':' en '+d+'d'}`;
    }).join(' · ')}</div></div>`;
  }

  const pct = totalKnown > 0 ? Math.round((totalPaid / totalKnown) * 100) : 0;

  main.innerHTML = `
    <div id="tab-content">
      ${alertHTML}
      <div class="summary-cards">
        <div class="card"><div class="card-label">Total conocido</div><div class="card-value blue">${fmt(totalKnown)||'$0'}</div><div class="card-sub">${sorted.filter(g=>getPago(currentMonth,g.id).monto).length} ítems con monto</div></div>
        <div class="card"><div class="card-label">Pagado</div><div class="card-value green">${fmt(totalPaid)||'$0'}</div><div class="card-sub">${countPaid} confirmados</div></div>
        <div class="card"><div class="card-label">Pendiente conocido</div><div class="card-value red">${fmt(totalKnown-totalPaid)||'—'}</div><div class="card-sub">${countPending} pendientes</div></div>
        <div class="card"><div class="card-label">Sin datos</div><div class="card-value yellow">${countNoData}</div><div class="card-sub">gastos sin información</div></div>
      </div>
      <div class="progress-section">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="section-title" style="margin:0;">Progreso del mes</span>
          <span style="font-size:0.74rem;color:#718096;">${countPaid}/${sorted.length} pagados · ${pct}%</span>
        </div>
        <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%"></div></div>
      </div>
      <div class="filter-row">
        <button class="filter-btn${currentFilter==='all'?' active':''}" onclick="setFilter('all',this)">Todos</button>
        <button class="filter-btn${currentFilter==='pendiente'?' active':''}" onclick="setFilter('pendiente',this)">Pendientes</button>
        <button class="filter-btn${currentFilter==='pagado'?' active':''}" onclick="setFilter('pagado',this)">Pagados</button>
        <button class="filter-btn${currentFilter==='sin_datos'?' active':''}" onclick="setFilter('sin_datos',this)">Sin datos</button>
      </div>
      <table class="expense-table">
        <thead><tr>
          <th style="width:175px;">Concepto</th><th>Cat.</th><th>Titular</th><th>Vence</th><th>Días</th><th>Monto fact.</th><th>Estado</th><th>Pagado el</th><th>Pagado $</th><th>Acción</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderHistorial(main) {
  if (!GASTOS_DATA) return;
  const cur = currentMonthKey();
  const months = Object.keys(GASTOS_DATA.pagos).sort().reverse().filter(m => m < cur);
  const gastos = getConfigGastos();

  main.innerHTML = months.map(mes => {
    const data = GASTOS_DATA.pagos[mes];
    const total = Object.values(data).reduce((s, p) => s + (p.monto || 0), 0);

    const rows = gastos.map(g => {
      const p = data[g.id];
      if (!p) return '';
      return `<tr class="expense-row">
        <td><strong>${g.nombre}</strong></td>
        <td>${getCatTag(g.cat)}</td>
        <td style="font-size:0.79rem;color:#a0aec0;">${g.persona}</td>
        <td style="font-size:0.82rem;">${p.vencimiento ? fmtDate(p.vencimiento) : '—'}</td>
        <td class="amount">${p.monto ? fmt(p.monto) : '<span class="amount-unknown">—</span>'}</td>
        <td>${p.pagado === true ? '<span class="badge badge-paid">✓ Pagado</span>' : p.pagado === false ? '<span class="badge badge-pending">Pendiente</span>' : '<span class="badge badge-nodata">Desconocido</span>'}</td>
        <td><span class="notes-text" title="${p.notas||''}">${p.notas||''}</span></td>
      </tr>`;
    }).join('');

    return `<div class="history-month">
      <div class="history-month-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span style="font-weight:600;">${fmtMonth(mes)}</span>
        <span class="history-total">${total>0?fmt(total):'Parcial'} ▾</span>
      </div>
      <div class="history-month-body">
        <table class="expense-table" style="margin-top:8px;">
          <thead><tr><th>Concepto</th><th>Cat.</th><th>Titular</th><th>Vencimiento</th><th>Monto</th><th>Estado</th><th>Notas</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join('') || '<div style="color:#4a5568;text-align:center;padding:40px;">No hay historial disponible aún.</div>';
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderContent();
}

// ── MODAL EDITAR ──
let editMes = null, editId = null;

function openEditar(mes, id, focusField) {
  editMes = mes; editId = id;
  const cfg = getConfigGastos().find(g => g.id === id) || { nombre: id, persona: '?' };
  const p = getPago(mes, id);

  document.getElementById('editar-titulo').textContent = `✏️ ${cfg.nombre}`;
  document.getElementById('editar-subtitulo').textContent = `${cfg.persona} · ${fmtMonth(mes)}`;

  document.getElementById('editar-monto').value = p.monto || '';
  document.getElementById('editar-minimo').value = p.pago_minimo || '';
  document.getElementById('editar-vencimiento').value = p.vencimiento || '';
  document.getElementById('editar-fuente').value = p.fuente || '';
  document.getElementById('editar-notas').value = p.notas || '';

  document.getElementById('editar-pagado').value = p.pagado === true ? 'true' : 'false';
  document.getElementById('editar-pagado-fecha').value = p.pagado_fecha || todayStr();
  document.getElementById('editar-pagado-monto').value = p.pagado_monto || (p.monto ? Math.round(p.monto) : '');

  document.getElementById('btn-anular').style.display = p.pagado === true ? 'block' : 'none';

  document.getElementById('modal-editar').classList.remove('hidden');

  // Focus specific field
  setTimeout(() => {
    if (focusField === 'monto') document.getElementById('editar-monto').focus();
    else if (focusField === 'vencimiento') document.getElementById('editar-vencimiento').focus();
  }, 100);
}

async function confirmEditar() {
  if (!editMes || !editId) return;

  const data = {
    monto: document.getElementById('editar-monto').value ? parseFloat(document.getElementById('editar-monto').value) : null,
    pago_minimo: document.getElementById('editar-minimo').value ? parseFloat(document.getElementById('editar-minimo').value) : null,
    vencimiento: document.getElementById('editar-vencimiento').value || null,
    fuente: document.getElementById('editar-fuente').value || null,
    notas: document.getElementById('editar-notas').value || null,
    pagado: document.getElementById('editar-pagado').value === 'true',
    pagado_fecha: document.getElementById('editar-pagado-fecha').value || null,
    pagado_monto: document.getElementById('editar-pagado-monto').value ? parseFloat(document.getElementById('editar-pagado-monto').value) : null,
  };

  // Clean nulls
  Object.keys(data).forEach(k => { if (data[k] === null || data[k] === undefined || data[k] === '') delete data[k]; });

  try {
    if (API_AVAILABLE) {
      await apiPatch(editMes, editId, data);
    }
    // Always update local data
    if (!GASTOS_DATA.pagos[editMes]) GASTOS_DATA.pagos[editMes] = {};
    if (!GASTOS_DATA.pagos[editMes][editId]) GASTOS_DATA.pagos[editMes][editId] = {};
    Object.assign(GASTOS_DATA.pagos[editMes][editId], data);
    GASTOS_DATA.ultima_actualizacion = todayStr();

    closeModal('modal-editar');
    renderContent();
  } catch (e) {
    alert('Error guardando: ' + e.message);
  }
}

async function anularPago() {
  if (!editMes || !editId) return;
  if (!confirm('¿Anular el pago registrado?')) return;

  const data = { pagado: false, pagado_fecha: null, pagado_monto: null };

  try {
    if (API_AVAILABLE) {
      await apiPatch(editMes, editId, data);
    }
    if (GASTOS_DATA.pagos[editMes] && GASTOS_DATA.pagos[editMes][editId]) {
      Object.assign(GASTOS_DATA.pagos[editMes][editId], data);
    }
    closeModal('modal-editar');
    renderContent();
  } catch (e) {
    alert('Error anulando: ' + e.message);
  }
}

// ── MODAL NUEVO GASTO ──
function openNuevoGastoModal() {
  document.getElementById('nuevo-nombre').value = '';
  document.getElementById('nuevo-id').value = '';
  document.getElementById('nuevo-categoria').value = 'servicio';
  document.getElementById('nuevo-persona').value = 'Tomás';
  document.getElementById('nuevo-monto').value = '';
  document.getElementById('nuevo-vencimiento').value = '';
  document.getElementById('nuevo-notas').value = '';
  document.getElementById('modal-nuevo').classList.remove('hidden');
  document.getElementById('nuevo-nombre').focus();

  // Auto-generate ID from nombre
  document.getElementById('nuevo-nombre').oninput = function() {
    document.getElementById('nuevo-id').value = this.value
      .toLowerCase()
      .replace(/[^a-z0-9áéíóúñ]/g, '_')
      .replace(/_+/g, '_')
      .replace(/^_|_$/g, '');
  };
}

async function confirmNuevoGasto() {
  const nombre = document.getElementById('nuevo-nombre').value.trim();
  const id = document.getElementById('nuevo-id').value.trim();
  const categoria = document.getElementById('nuevo-categoria').value;
  const persona = document.getElementById('nuevo-persona').value;
  const monto = document.getElementById('nuevo-monto').value ? parseFloat(document.getElementById('nuevo-monto').value) : null;
  const vencimiento = document.getElementById('nuevo-vencimiento').value || null;
  const notas = document.getElementById('nuevo-notas').value.trim() || null;

  if (!nombre || !id) { alert('Nombre e ID son obligatorios'); return; }

  // Check duplicate
  const existing = getConfigGastos().find(g => g.id === id);
  if (existing) { alert(`Ya existe "${existing.nombre}" con ID ${id}`); return; }

  const data = { id, nombre, categoria, persona, monto, vencimiento, notas };

  try {
    if (API_AVAILABLE) {
      await apiPost('/api/gasto-nuevo', data);
    }
    // Update local state
    CONFIG_DATA.gastos_recurrentes.push({
      id, nombre,
      categoria: categoria === 'tarjeta' ? 'tarjeta_credito' : categoria,
      persona,
      gmail_busqueda: [nombre],
      dia_vencimiento_aprox: null,
      activo: true
    });
    const cur = currentMonthKey();
    if (!GASTOS_DATA.pagos[cur]) GASTOS_DATA.pagos[cur] = {};
    GASTOS_DATA.pagos[cur][id] = {
      vencimiento, monto, pagado: false, pagado_fecha: null,
      pagado_monto: null, fuente: 'carga_manual', notas: notas || ''
    };
    const nxt = nextMonthKey();
    if (!GASTOS_DATA.pagos[nxt]) GASTOS_DATA.pagos[nxt] = {};
    if (!GASTOS_DATA.pagos[nxt][id]) {
      GASTOS_DATA.pagos[nxt][id] = { ...GASTOS_DATA.pagos[cur][id] };
    }

    closeModal('modal-nuevo');
    renderTabs();
    renderContent();
  } catch (e) {
    alert('Error creando gasto: ' + e.message);
  }
}

// ── MODAL UTILS ──
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal('modal-editar');
    closeModal('modal-nuevo');
  }
});

// ── DATA LOAD ──
async function loadData() {
  try {
    const [gastos, config] = await Promise.all([
      apiGet('/api/gastos'),
      apiGet('/api/config')
    ]);
    GASTOS_DATA = gastos;
    CONFIG_DATA = config;
    API_AVAILABLE = true;

    document.getElementById('conn-status').className = 'conn-status conn-ok';
    document.getElementById('conn-status').textContent = 'Conectado';

    const upd = gastos.ultima_actualizacion;
    document.getElementById('last-update').textContent = upd ? `Actualizado: ${upd.split('-').reverse().join('/')}` : 'Sin datos';
  } catch (e) {
    // Fallback: static mode (GitHub Pages / same-origin)
    try {
      const [gastos, config] = await Promise.all([
        fetch('gastos.json').then(r => r.json()),
        fetch('config.json').then(r => r.json())
      ]);
      GASTOS_DATA = gastos;
      CONFIG_DATA = config;
      API_AVAILABLE = false;
      document.getElementById('conn-status').className = 'conn-status conn-ok';
      document.getElementById('conn-status').textContent = 'Estático (GitHub Pages)';
      const upd = gastos.ultima_actualizacion;
      document.getElementById('last-update').textContent = upd ? `Actualizado: ${upd.split('-').reverse().join('/')}` : 'Sin datos';
    } catch (e2) {
      API_AVAILABLE = false;
      document.getElementById('conn-status').className = 'conn-status conn-off';
      document.getElementById('conn-status').textContent = 'Sin conexión';
      document.getElementById('last-update').textContent = 'No se pudo cargar';
      GASTOS_DATA = { pagos: {}, ultima_actualizacion: null };
      CONFIG_DATA = { gastos_recurrentes: [] };
    }
  }

  renderTabs();
  renderContent();
}

async function refreshData() {
  document.getElementById('main-content').innerHTML = '<div class="loading">Actualizando datos</div>';
  await loadData();
}

// ── INIT ──
loadData();
</script>
