<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos · Tomás Norman</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f1117; --bg2: #1a1f2e; --bg3: #212736;
  --border: #2d3748; --border2: #3d4a5c;
  --text: #e2e8f0; --text2: #a0aec0; --text3: #718096; --text4: #4a5568;
  --blue: #63b3ed; --green: #68d391; --red: #fc8181; --yellow: #f6e05e; --orange: #f6ad55;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  padding-top: max(14px, env(safe-area-inset-top));
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100;
}
.header-title { font-size: 1.05rem; font-weight: 700; color: #f7fafc; }
.header-title span { color: var(--blue); }
.header-sub { font-size: 0.7rem; color: var(--text3); margin-top: 1px; }
.header-emoji { font-size: 1.5rem; }

/* ── BOTTOM NAV (iPhone style) ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(26,31,46,0.97);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: max(8px, var(--safe-bottom));
  z-index: 200;
  backdrop-filter: blur(10px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px 6px; cursor: pointer; color: var(--text3);
  font-size: 0.62rem; font-weight: 500; letter-spacing: 0.01em;
  transition: color 0.15s; gap: 3px; border: none; background: none;
}
.nav-item.active { color: var(--blue); }
.nav-icon { font-size: 1.35rem; line-height: 1; }

/* ── MAIN CONTENT ── */
.main {
  padding: 14px 14px;
  padding-bottom: calc(70px + max(8px, var(--safe-bottom)));
  max-width: 700px; margin: 0 auto;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── ALERT BANNER ── */
.alert {
  background: #2d1a1a; border: 1px solid #742a2a; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 12px; font-size: 0.82rem; color: var(--red);
  display: flex; gap: 10px; align-items: flex-start; line-height: 1.4;
}
.alert-info { background: #1a2535; border-color: #2b4a7a; color: var(--blue); }

/* ── SUMMARY CARDS ── */
.summary-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;
}
.sum-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 14px;
}
.sum-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 5px; }
.sum-value { font-size: 1.25rem; font-weight: 700; line-height: 1; }
.sum-value.red { color: var(--red); }
.sum-value.green { color: var(--green); }
.sum-value.yellow { color: var(--yellow); }
.sum-value.blue { color: var(--blue); }
.sum-sub { font-size: 0.67rem; color: var(--text3); margin-top: 4px; }

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 14px; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.progress-label { font-size: 0.72rem; color: var(--text3); font-weight: 500; }
.progress-bar-outer { background: var(--border); border-radius: 6px; height: 7px; overflow: hidden; }
.progress-bar-inner { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #38a169, #68d391); transition: width 0.5s; }

/* ── FILTER PILLS ── */
.filter-row { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: transparent; color: var(--text3); font-size: 0.77rem; cursor: pointer;
  white-space: nowrap; flex-shrink: 0; transition: all 0.15s;
}
.filter-btn.active { background: #1a2c4e; border-color: var(--blue); color: var(--blue); }

/* ── EXPENSE CARDS (mobile-first, reemplaza la tabla) ── */
.expense-list { display: flex; flex-direction: column; gap: 8px; }
.expense-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 13px 14px; cursor: pointer; transition: background 0.15s; active: background var(--bg3);
}
.expense-card:active { background: var(--bg3); }
.expense-card.urgent { border-color: #742a2a; background: #1e1515; }
.expense-card.paid { opacity: 0.7; }
.expense-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.expense-name { font-size: 0.92rem; font-weight: 600; color: var(--text); line-height: 1.2; }
.expense-persona { font-size: 0.7rem; color: var(--text3); margin-top: 2px; }
.expense-card-mid { display: flex; justify-content: space-between; align-items: center; }
.expense-monto { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.expense-monto.unknown { font-size: 0.8rem; font-style: italic; color: var(--text4); font-weight: 400; }
.expense-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.expense-vence { font-size: 0.75rem; color: var(--text2); }
.expense-vence.urgent { color: var(--red); font-weight: 700; }
.expense-notas { font-size: 0.71rem; color: var(--text4); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── BADGES ── */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; white-space: nowrap; }
.badge-paid { background: #1c4532; color: var(--green); }
.badge-overdue { background: #451a20; color: var(--red); animation: pulse 2s infinite; }
.badge-urgent { background: #44271a; color: var(--orange); }
.badge-soon { background: #3d3d1a; color: var(--yellow); }
.badge-pending { background: #1a2535; color: var(--text3); }
.badge-nodata { background: #1a1a2e; color: #7c6fcd; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.days-chip { font-size: 0.68rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.days-red { background:#451a20; color:var(--red); }
.days-orange { background:#44271a; color:var(--orange); }
.days-yellow { background:#3d3d1a; color:var(--yellow); }
.days-green { background:#1c4532; color:var(--green); }

.cat-tag { font-size: 0.63rem; padding: 2px 6px; border-radius: 5px; font-weight: 500; }
.cat-tarjeta { background:#1a2c4e; color:var(--blue); }
.cat-impuesto { background:#2d1a4e; color:#b794f4; }
.cat-servicio { background:#1a3d2d; color:var(--green); }
.cat-honorarios { background:#3d2d1a; color:var(--orange); }
.cat-expensas { background:#3d1a2d; color:#f687b3; }
.cat-salud { background:#1a3d3d; color:#76e4f7; }
.cat-suscripcion { background:#2d3d1a; color:#9ae6b4; }
.cat-cooperativa { background:#3d3d1a; color:var(--yellow); }

/* ── HISTORIAL ── */
.hist-mes { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.hist-mes-header { padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.hist-mes-header:active { background: var(--bg3); }
.hist-mes-title { font-weight: 700; font-size: 0.95rem; }
.hist-mes-total { font-weight: 700; color: var(--blue); font-size: 0.9rem; }
.hist-mes-body { display: none; border-top: 1px solid var(--border); }
.hist-mes-body.open { display: block; }
.hist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 8px; }
.hist-item:last-child { border-bottom: none; }
.hist-item-name { font-size: 0.84rem; font-weight: 500; }
.hist-item-monto { font-size: 0.84rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text2); }

/* ── MES ANTERIOR BANNER ── */
.prev-mes-banner {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
}
.prev-mes-banner:active { background: var(--bg3); }
.prev-mes-label { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }
.prev-mes-valor { font-size: 1.1rem; font-weight: 700; color: var(--text2); }

/* ── CARGA RÁPIDA ── */
.carga-container { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.carga-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-weight: 600; padding: 0 2px; margin-top: 6px; }
.carga-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.carga-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 8px; font-weight: 600; }
.carga-select, .carga-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 12px 14px; font-size: 1rem; outline: none;
  -webkit-appearance: none; font-family: inherit;
}
.carga-select:focus, .carga-input:focus { border-color: var(--blue); }
.carga-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.carga-btn {
  width: 100%; background: linear-gradient(135deg, #2b6cb0, #3182ce);
  border: none; color: #fff; padding: 16px; border-radius: 12px;
  font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit;
}
.carga-btn:active { opacity: 0.85; transform: scale(0.98); }
.carga-status { background: var(--bg2); border-radius: 12px; padding: 16px; text-align: center; font-size: 0.95rem; font-weight: 600; display: none; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 500;
  display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0; width: 100%; max-width: 560px;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  padding-bottom: max(20px, var(--safe-bottom));
  max-height: 90vh; overflow-y: auto;
}
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 16px; }
.modal-header { padding: 0 20px 14px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 1rem; font-weight: 700; }
.modal-header p { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }
.modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.modal-ref { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; font-size: 0.82rem; color: var(--text3); }
.modal-ref span { color: var(--blue); font-weight: 600; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 0.77rem; color: var(--text2); font-weight: 500; }
.form-group input, .form-group textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 12px; font-size: 1rem; outline: none; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--blue); }
.form-group textarea { resize: none; min-height: 60px; }
.modal-footer { padding: 12px 20px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
.btn-cancel { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text3); padding: 13px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
.btn-confirm { flex: 2; background: #276749; border: 1px solid #38a169; color: #f0fff4; padding: 13px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-anular { background: transparent; border: 1px solid #742a2a; color: var(--red); padding: 13px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }

/* ── SECTION TITLE ── */
.section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-weight: 600; margin-bottom: 8px; padding: 0 2px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">Gastos <span>· Tomás Norman</span></div>
    <div class="header-sub" id="header-sub">Cargando datos...</div>
  </div>
  <div class="header-emoji">💰</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TAB: MAYO -->
  <div id="tab-mayo" class="tab-content active">
    <div id="urgente-banner"></div>

    <!-- Resumen del mes anterior -->
    <div class="prev-mes-banner" onclick="document.getElementById('nav-historial').click()">
      <div>
        <div class="prev-mes-label">Mes anterior · Abril 2026</div>
        <div class="prev-mes-valor" id="abril-total">—</div>
      </div>
      <div style="color:var(--text3);font-size:1.1rem;">→</div>
    </div>

    <div class="summary-grid" id="mayo-cards"></div>

    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Pagados este mes</span>
        <span class="progress-label" id="mayo-progress-label"></span>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="mayo-progress-bar" style="width:0%"></div></div>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" onclick="filterCards('all',this)">Todos</button>
      <button class="filter-btn" onclick="filterCards('pendiente',this)">Pendientes</button>
      <button class="filter-btn" onclick="filterCards('pagado',this)">Pagados</button>
      <button class="filter-btn" onclick="filterCards('sin_datos',this)">Sin datos</button>
    </div>

    <div class="expense-list" id="mayo-list"></div>
  </div>

  <!-- TAB: JUNIO -->
  <div id="tab-junio" class="tab-content">
    <div class="alert alert-info" style="margin-bottom:12px;">
      ℹ️ <div>Solo se muestran gastos confirmados para Junio 2026.</div>
    </div>
    <div class="expense-list" id="junio-list"></div>
  </div>

  <!-- TAB: HISTORIAL -->
  <div id="tab-historial" class="tab-content">
    <div id="historial-container"></div>
  </div>

  <!-- TAB: CARGAR -->
  <div id="tab-cargar" class="tab-content">
    <div class="carga-container">
      <div class="carga-card">
        <div class="carga-label">¿Qué gasto?</div>
        <select id="carga-gasto" class="carga-select">
          <option value="">— Elegí un gasto —</option>
        </select>
      </div>

      <div class="carga-card">
        <div class="carga-label">¿Qué mes?</div>
        <select id="carga-mes" class="carga-select">
          <option value="2026-05">Mayo 2026</option>
          <option value="2026-06">Junio 2026</option>
          <option value="2026-07">Julio 2026</option>
        </select>
      </div>

      <div class="carga-card">
        <div class="carga-grid">
          <div>
            <div class="carga-label">Monto total ($)</div>
            <input type="number" id="carga-monto" class="carga-input" placeholder="Ej: 244709" inputmode="numeric" />
          </div>
          <div>
            <div class="carga-label">Pago mínimo ($)</div>
            <input type="number" id="carga-minimo" class="carga-input" placeholder="Opcional" inputmode="numeric" />
          </div>
        </div>
      </div>

      <div class="carga-card">
        <div class="carga-label">Fecha de vencimiento</div>
        <input type="date" id="carga-vencimiento" class="carga-input" />
      </div>

      <div class="carga-card">
        <div class="carga-label">Notas (opcional)</div>
        <input type="text" id="carga-notas" class="carga-input" placeholder="Ej: Joana · Mastercard Black" />
      </div>

      <button class="carga-btn" onclick="guardarEnGitHub()">💾 Guardar dato</button>

      <div id="carga-status" class="carga-status"></div>
    </div>
  </div>

</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-mayo" onclick="showTab('mayo',this)">
    <span class="nav-icon">🔴</span>Mayo
  </button>
  <button class="nav-item" id="nav-junio" onclick="showTab('junio',this)">
    <span class="nav-icon">📅</span>Junio
  </button>
  <button class="nav-item" id="nav-historial" onclick="showTab('historial',this)">
    <span class="nav-icon">📊</span>Historial
  </button>
  <button class="nav-item" id="nav-cargar" onclick="showTab('cargar',this)">
    <span class="nav-icon">➕</span>Cargar
  </button>
</nav>

<!-- MODAL PAGO -->
<div class="modal-overlay hidden" id="modal-pago" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-titulo">Registrar pago</h3>
      <p id="modal-subtitulo"></p>
    </div>
    <div class="modal-body">
      <div class="modal-ref" id="modal-ref-monto"></div>
      <div class="form-group">
        <label>Fecha de pago</label>
        <input type="date" id="modal-fecha" />
      </div>
      <div class="form-group">
        <label>Monto pagado ($)</label>
        <input type="number" id="modal-monto-pagado" placeholder="0" min="0" step="1" inputmode="numeric" />
      </div>
      <div class="form-group">
        <label>Notas (opcional)</label>
        <textarea id="modal-notas" placeholder="Ej: pago parcial, nro. de transferencia..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-anular" id="btn-anular" onclick="anularPago()" style="display:none;">✕ Anular</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmPago()">✓ Confirmar</button>
    </div>
  </div>
</div>

<script>

const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// ── PAGOS BASE ──

// ── LOCALSTORAGE ──
const LS_KEY = 'gastos_pagos_v1';
function loadOverrides() { try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){return{};} }
function saveOverride(mes,id,data) { const o=loadOverrides(); if(!o[mes])o[mes]={}; o[mes][id]=data; localStorage.setItem(LS_KEY,JSON.stringify(o)); }
function removeOverride(mes,id) { const o=loadOverrides(); if(o[mes]){delete o[mes][id]; if(!Object.keys(o[mes]).length)delete o[mes];} localStorage.setItem(LS_KEY,JSON.stringify(o)); }
function getMergedPago(mes,id) {
  const base=(PAGOS[mes]&&PAGOS[mes][id])?{...PAGOS[mes][id]}:{vencimiento:null,monto:null,pagado:false,notas:''};
  const ov=loadOverrides(); const o=ov[mes]&&ov[mes][id];
  if(o) Object.assign(base,o);
  return base;
}

// ── HELPERS ──
function fmt(n) { if(!n)return null; return '$\u00a0'+Math.round(n).toLocaleString('es-AR'); }
function fmtDate(s) { if(!s)return null; const[y,m,d]=s.split('-'); return `${d}/${m}`; }
function daysUntil(s) { if(!s)return null; return Math.round((new Date(s+'T00:00:00')-TODAY)/86400000); }

function getDaysBadge(days,paid) {
  if(paid) return `<span class="days-chip days-green">✓</span>`;
  if(days===null) return '';
  if(days<0) return `<span class="days-chip days-red">${days}d</span>`;
  if(days===0) return `<span class="days-chip days-red">HOY</span>`;
  if(days===1) return `<span class="days-chip days-red">MAÑANA</span>`;
  if(days<=3) return `<span class="days-chip days-orange">${days}d</span>`;
  if(days<=10) return `<span class="days-chip days-yellow">${days}d</span>`;
  return `<span class="days-chip days-green">${days}d</span>`;
}

function getStatusBadge(p) {
  if(p.pagado===true) return `<span class="badge badge-paid">✓ Pagado</span>`;
  if(!p.vencimiento&&!p.monto) return `<span class="badge badge-nodata">? Sin datos</span>`;
  const d=daysUntil(p.vencimiento);
  if(d!==null&&d<0) return `<span class="badge badge-overdue">⚠ Vencido</span>`;
  if(d!==null&&d<=1) return `<span class="badge badge-urgent">🔴 Urgente</span>`;
  if(d!==null&&d<=5) return `<span class="badge badge-urgent">🟠 Próximo</span>`;
  if(d!==null&&d<=10) return `<span class="badge badge-soon">🟡 Esta semana</span>`;
  return `<span class="badge badge-pending">● Pendiente</span>`;
}

function getCatTag(cat) {
  const L={tarjeta:'Tarjeta',impuesto:'Impuesto',servicio:'Servicio',honorarios:'Honorarios',expensas:'Expensas',salud:'Salud',suscripcion:'Suscripción',cooperativa:'Cooperativa'};
  return `<span class="cat-tag cat-${cat}">${L[cat]||cat}</span>`;
}

function getGroup(p) {
  if(p.pagado===true) return 'pagado';
  if(!p.vencimiento&&!p.monto) return 'sin_datos';
  return 'pendiente';
}

// ── RENDER CARDS ──
let currentFilter='all';

function renderCards(mesKey, listId) {
  const list = document.getElementById(listId);
  if(!list) return;
  let totalKnown=0, totalPaid=0, countPaid=0, countPending=0, countNoData=0;

  const gastos = mesKey==='2026-06'
    ? CONFIG.gastos.filter(g=>PAGOS['2026-06']&&PAGOS['2026-06'][g.id])
    : CONFIG.gastos;

  const sorted = [...gastos].sort((a,b)=>{
    const pa=getMergedPago(mesKey,a.id), pb=getMergedPago(mesKey,b.id);
    if(pa.pagado===true&&pb.pagado!==true) return 1;
    if(pa.pagado!==true&&pb.pagado===true) return -1;
    const da=daysUntil(pa.vencimiento), db=daysUntil(pb.vencimiento);
    if(da===null&&db===null) return 0;
    if(da===null) return 1; if(db===null) return -1;
    return da-db;
  });

  list.innerHTML = sorted.map(g => {
    const p = getMergedPago(mesKey, g.id);
    const group = getGroup(p);
    if(mesKey==='2026-05') {
      if(currentFilter!=='all'&&group!==currentFilter) return '';
      if(p.monto) totalKnown+=p.monto;
      if(p.pagado===true){totalPaid+=(p.pagado_monto||p.monto||0);countPaid++;}
      else if(group==='sin_datos') countNoData++;
      else countPending++;
    }
    const days=daysUntil(p.vencimiento);
    const isUrgent=days!==null&&days<=2&&p.pagado!==true;
    const isPaid=p.pagado===true;

    return `<div class="expense-card${isUrgent?' urgent':''}${isPaid?' paid':''}" onclick="openModal('${mesKey}','${g.id}')">
      <div class="expense-card-top">
        <div>
          <div class="expense-name">${g.nombre}</div>
          <div class="expense-persona">${g.persona} · ${getCatTag(g.cat)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          ${getStatusBadge(p)}
          ${getDaysBadge(days,isPaid)}
        </div>
      </div>
      <div class="expense-card-mid">
        <div class="${p.monto?'expense-monto':'expense-monto unknown'}">${p.monto?fmt(p.monto):'Sin monto'}</div>
        <div class="expense-vence${isUrgent?' urgent':''}">${p.vencimiento?'Vence '+fmtDate(p.vencimiento):isPaid&&p.pagado_fecha?'Pagado '+fmtDate(p.pagado_fecha):''}</div>
      </div>
      ${p.notas?`<div class="expense-notas">${p.notas}</div>`:''}
    </div>`;
  }).join('');

  if(mesKey==='2026-05') {
    const pct=totalKnown>0?Math.round((totalPaid/totalKnown)*100):0;
    document.getElementById('mayo-cards').innerHTML=`
      <div class="sum-card"><div class="sum-label">Total conocido</div><div class="sum-value blue">${fmt(totalKnown)||'—'}</div><div class="sum-sub">${gastos.filter(g=>getMergedPago(mesKey,g.id).monto).length} ítems</div></div>
      <div class="sum-card"><div class="sum-label">Pagado</div><div class="sum-value green">${fmt(totalPaid)||'$0'}</div><div class="sum-sub">${countPaid} confirmados</div></div>
      <div class="sum-card"><div class="sum-label">Pendiente</div><div class="sum-value red">${totalKnown>totalPaid?fmt(totalKnown-totalPaid):'—'}</div><div class="sum-sub">${countPending} pendientes</div></div>
      <div class="sum-card"><div class="sum-label">Sin datos</div><div class="sum-value yellow">${countNoData}</div><div class="sum-sub">sin información</div></div>
    `;
    document.getElementById('mayo-progress-bar').style.width=pct+'%';
    document.getElementById('mayo-progress-label').textContent=`${countPaid}/${CONFIG.gastos.length} · ${pct}%`;

    // Banner urgente dinámico
    const urgentes=sorted.filter(g=>{const p=getMergedPago(mesKey,g.id);const d=daysUntil(p.vencimiento);return d!==null&&d<=3&&p.pagado!==true;});
    const banner=document.getElementById('urgente-banner');
    if(urgentes.length>0){
      banner.innerHTML=`<div class="alert" style="margin-bottom:12px;">🚨 <div><strong>URGENTE:</strong> ${urgentes.map(g=>{const p=getMergedPago(mesKey,g.id);const d=daysUntil(p.vencimiento);return `${g.nombre}${p.monto?' '+fmt(p.monto):''}${d===0?' HOY':d===1?' MAÑANA':' en '+d+'d'}`;}).join(' · ')}</div></div>`;
    } else { banner.innerHTML=''; }
  }
}

// ── HISTORIAL ──
function renderHistorial() {
  const container=document.getElementById('historial-container');
  const labels={'2026-04':'Abril 2026','2026-03':'Marzo 2026'};
  const meses=Object.keys(PAGOS).sort().reverse().filter(m=>m!=='2026-05'&&m!=='2026-06');

  // Actualizar banner mes anterior
  const abril=PAGOS['2026-04'];
  if(abril){
    const totalAbril=Object.values(abril).reduce((s,p)=>s+(p.monto||0),0);
    document.getElementById('abril-total').textContent=fmt(totalAbril)||'Datos parciales';
  }

  container.innerHTML=meses.map(mes=>{
    const data=PAGOS[mes];
    const total=Object.values(data).reduce((s,p)=>s+(p.monto||0),0);
    const items=CONFIG.gastos.map(g=>{
      const p=data[g.id]; if(!p||(!p.monto&&!p.vencimiento)) return '';
      return `<div class="hist-item">
        <div><div class="hist-item-name">${g.nombre}</div><div style="font-size:0.68rem;color:var(--text3);margin-top:2px;">${getCatTag(g.cat)}</div></div>
        <div style="text-align:right;">
          <div class="hist-item-monto">${p.monto?fmt(p.monto):'—'}</div>
          <div style="font-size:0.68rem;color:var(--text3);">${fmtDate(p.vencimiento)||''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="hist-mes">
      <div class="hist-mes-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="hist-mes-title">${labels[mes]||mes}</span>
        <span class="hist-mes-total">${total>0?fmt(total):'Parcial'} ▾</span>
      </div>
      <div class="hist-mes-body">${items||'<div style="padding:16px;color:var(--text4);font-size:0.85rem;">Sin datos registrados</div>'}</div>
    </div>`;
  }).join('')||'<div style="color:var(--text4);text-align:center;padding:40px;">No hay historial disponible.</div>';
}

function filterCards(f,btn) {
  currentFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards('2026-05','mayo-list');
}

function showTab(name,btn) {
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── MODAL PAGO ──
let modalMes=null, modalId=null;

function openModal(mes,id) {
  modalMes=mes; modalId=id;
  const cfg=CONFIG.gastos.find(g=>g.id===id);
  const p=getMergedPago(mes,id);
  const mesLabel={'2026-05':'Mayo 2026','2026-06':'Junio 2026'}[mes]||mes;
  document.getElementById('modal-titulo').textContent=`💳 ${cfg.nombre}`;
  document.getElementById('modal-subtitulo').textContent=`${cfg.persona} · ${mesLabel}`;
  document.getElementById('modal-ref-monto').innerHTML=p.monto?`Monto facturado: <span>${fmt(p.monto)}</span>`:'<span style="color:var(--text4)">Monto no disponible</span>';
  document.getElementById('modal-fecha').value=p.pagado_fecha||todayStr();
  document.getElementById('modal-monto-pagado').value=p.pagado_monto||(p.monto?Math.round(p.monto):'');
  document.getElementById('modal-notas').value=p.notas_pago||'';
  document.getElementById('btn-anular').style.display=p.pagado===true?'block':'none';
  document.getElementById('modal-pago').classList.remove('hidden');
}

function closeModal() { document.getElementById('modal-pago').classList.add('hidden'); modalMes=null; modalId=null; }

function confirmPago() {
  if(!modalMes||!modalId) return;
  saveOverride(modalMes,modalId,{
    pagado:true,
    pagado_fecha:document.getElementById('modal-fecha').value,
    pagado_monto:parseFloat(document.getElementById('modal-monto-pagado').value)||null,
    notas_pago:document.getElementById('modal-notas').value.trim()
  });
  closeModal();
  renderCards('2026-05','mayo-list');
  renderCards('2026-06','junio-list');
}

function anularPago() {
  if(!confirm('¿Anular el pago registrado?')) return;
  removeOverride(modalMes,modalId);
  closeModal();
  renderCards('2026-05','mayo-list');
  renderCards('2026-06','junio-list');
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// ── GITHUB API ──
const GH_REPO='70miboy/gastos-mensuales';
const GH_FILE='gastos.json';

function getToken() {
  let t=localStorage.getItem('gh_token');
  if(!t){t=prompt('Ingresá tu GitHub token (ghp_...)');if(t)localStorage.setItem('gh_token',t.trim());}
  return t;
}

function initCargaSelect() {
  const sel=document.getElementById('carga-gasto');
  CONFIG.gastos.forEach(g=>{const o=document.createElement('option');o.value=g.id;o.textContent=g.nombre+' ('+g.persona+')';sel.appendChild(o);});
}

function showStatus(msg,color) {
  const el=document.getElementById('carga-status');
  el.style.display='block'; el.style.color=color||'var(--text)'; el.textContent=msg;
  el.scrollIntoView({behavior:'smooth'});
}

async function guardarEnGitHub() {
  const gastoId=document.getElementById('carga-gasto').value;
  const mes=document.getElementById('carga-mes').value;
  const monto=document.getElementById('carga-monto').value;
  const venc=document.getElementById('carga-vencimiento').value;
  const minimo=document.getElementById('carga-minimo').value;
  const notas=document.getElementById('carga-notas').value;
  if(!gastoId){alert('Elegí un gasto primero');return;}
  if(!monto&&!venc){alert('Ingresá al menos el monto o la fecha');return;}
  showStatus('⏳ Guardando...','var(--blue)');
  const GH_TOKEN=getToken();
  if(!GH_TOKEN){showStatus('❌ Token necesario','var(--red)');return;}
  try {
    const getRes=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{headers:{'Authorization':`token ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json'}});
    if(!getRes.ok){localStorage.removeItem('gh_token');showStatus('❌ Token inválido. Recargá e ingresalo de nuevo.','var(--red)');return;}
    const getJson=await getRes.json();
    const sha=getJson.sha;
    const contenido=JSON.parse(atob(getJson.content.replace(/\n/g,'')));
    if(!contenido.pagos[mes])contenido.pagos[mes]={};
    const entrada=contenido.pagos[mes][gastoId]||{};
    if(monto)entrada.monto=parseFloat(monto);
    if(venc)entrada.vencimiento=venc;
    if(minimo)entrada.pago_minimo=parseFloat(minimo);
    if(notas)entrada.notas=notas;
    if(entrada.pagado===undefined)entrada.pagado=false;
    entrada.fuente='carga_manual_iphone';
    contenido.pagos[mes][gastoId]=entrada;
    contenido.ultima_actualizacion=new Date().toISOString().split('T')[0];
    const cfg=CONFIG.gastos.find(g=>g.id===gastoId);
    const putRes=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_FILE}`,{
      method:'PUT',
      headers:{'Authorization':`token ${GH_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:`Carga manual: ${cfg.nombre} ${mes}`,content:btoa(unescape(encodeURIComponent(JSON.stringify(contenido,null,2)))),sha})
    });
    if(putRes.ok){
      showStatus('✅ ¡Guardado en GitHub!','var(--green)');
      ['carga-gasto','carga-monto','carga-vencimiento','carga-minimo','carga-notas'].forEach(id=>document.getElementById(id).value='');
    } else {
      const err=await putRes.json();
      showStatus('❌ Error: '+(err.message||'No se pudo guardar'),'var(--red)');
    }
  } catch(e){showStatus('❌ Error de conexión: '+e.message,'var(--red)');}
}

// ── INIT ──
async function init() {
  initCargaSelect();
  document.getElementById('header-sub').textContent='Cargando datos de GitHub...';
  try {
    const res=await fetch(`https://raw.githubusercontent.com/${GH_REPO}/master/${GH_FILE}?t=${Date.now()}`);
    if(res.ok){
      const data=await res.json();
      Object.keys(data.pagos).forEach(mes=>{
        if(!PAGOS[mes])PAGOS[mes]={};
        Object.keys(data.pagos[mes]).forEach(id=>{
          const r=data.pagos[mes][id];
          if(r.monto||r.vencimiento||r.pagado===true){
            PAGOS[mes][id]={
              vencimiento:r.vencimiento||(PAGOS[mes][id]&&PAGOS[mes][id].vencimiento)||null,
              monto:r.monto||(PAGOS[mes][id]&&PAGOS[mes][id].monto)||null,
              pagado:r.pagado!==undefined?r.pagado:(PAGOS[mes][id]&&PAGOS[mes][id].pagado),
              notas:r.notas||(PAGOS[mes][id]&&PAGOS[mes][id].notas)||''
            };
          }
        });
      });
      const upd=data.ultima_actualizacion;
      document.getElementById('header-sub').textContent=upd?'Actualizado: '+upd.split('-').reverse().join('/'):'Datos en vivo';
    }
  } catch(e){ document.getElementById('header-sub').textContent='Datos locales (sin conexión)'; }
  renderCards('2026-05','mayo-list');
  renderCards('2026-06','junio-list');
  renderHistorial();
}

init();
