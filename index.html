<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<title>Gastos · Tomás Norman</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0f1117; --bg2: #1a1f2e; --bg3: #212736;
  --border: #2d3748; --border2: #3d4a5c;
  --text: #e2e8f0; --text2: #a0aec0; --text3: #718096; --text4: #4a5568;
  --blue: #63b3ed; --green: #68d391; --red: #fc8181; --yellow: #f6e05e; --orange: #f6ad55;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  padding-top: max(14px, env(safe-area-inset-top));
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 100;
}
.header-title { font-size: 1.05rem; font-weight: 700; color: #f7fafc; }
.header-title span { color: var(--blue); }
.header-sub { font-size: 0.7rem; color: var(--text3); margin-top: 1px; }
.header-emoji { font-size: 1.5rem; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(26,31,46,0.97);
  border-top: 1px solid var(--border);
  display: flex;
  padding-bottom: max(8px, var(--safe-bottom));
  z-index: 200;
  backdrop-filter: blur(10px);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px 6px; cursor: pointer; color: var(--text3);
  font-size: 0.62rem; font-weight: 500; letter-spacing: 0.01em;
  transition: color 0.15s; gap: 3px; border: none; background: none;
}
.nav-item.active { color: var(--blue); }
.nav-icon { font-size: 1.35rem; line-height: 1; }

/* ── MAIN ── */
.main {
  padding: 14px 14px;
  padding-bottom: calc(70px + max(8px, var(--safe-bottom)));
  max-width: 700px; margin: 0 auto;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ── ALERT ── */
.alert {
  background: #2d1a1a; border: 1px solid #742a2a; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 12px; font-size: 0.82rem; color: var(--red);
  display: flex; gap: 10px; align-items: flex-start; line-height: 1.4;
}
.alert-info { background: #1a2535; border-color: #2b4a7a; color: var(--blue); }

/* ── SUMMARY ── */
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.sum-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.sum-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 5px; }
.sum-value { font-size: 1.25rem; font-weight: 700; line-height: 1; }
.sum-value.red { color: var(--red); }
.sum-value.green { color: var(--green); }
.sum-value.yellow { color: var(--yellow); }
.sum-value.blue { color: var(--blue); }
.sum-sub { font-size: 0.67rem; color: var(--text3); margin-top: 4px; }

/* ── PROGRESS ── */
.progress-wrap { margin-bottom: 14px; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.progress-label { font-size: 0.72rem; color: var(--text3); font-weight: 500; }
.progress-bar-outer { background: var(--border); border-radius: 6px; height: 7px; overflow: hidden; }
.progress-bar-inner { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #38a169, #68d391); transition: width 0.5s; }

/* ── FILTER ── */
.filter-row { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
.filter-row::-webkit-scrollbar { display: none; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text3); font-size: 0.77rem; cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.15s; }
.filter-btn.active { background: #1a2c4e; border-color: var(--blue); color: var(--blue); }

/* ── EXPENSE CARDS ── */
.expense-list { display: flex; flex-direction: column; gap: 8px; }
.expense-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
  padding: 13px 14px; cursor: pointer; transition: background 0.15s;
  -webkit-user-select: text; user-select: text;
}
.expense-card:active { background: var(--bg3); }
.expense-card.urgent { border-color: #742a2a; background: #1e1515; }
.expense-card.paid { opacity: 0.7; }
.expense-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.expense-name { font-size: 0.92rem; font-weight: 600; color: var(--text); line-height: 1.2; }
.expense-persona { font-size: 0.7rem; color: var(--text3); margin-top: 2px; }
.expense-card-mid { display: flex; justify-content: space-between; align-items: center; }
.expense-monto { font-size: 1.05rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.expense-monto.unknown { font-size: 0.8rem; font-style: italic; color: var(--orange); font-weight: 400; }
.expense-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.expense-vence { font-size: 0.75rem; color: var(--text2); }
.expense-vence.urgent { color: var(--red); font-weight: 700; }
.expense-notas { font-size: 0.71rem; color: var(--text4); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── BADGES ── */
.badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 20px; font-size: 0.68rem; font-weight: 600; white-space: nowrap; }
.badge-paid { background: #1c4532; color: var(--green); }
.badge-overdue { background: #451a20; color: var(--red); animation: pulse 2s infinite; }
.badge-urgent { background: #44271a; color: var(--orange); }
.badge-soon { background: #3d3d1a; color: var(--yellow); }
.badge-pending { background: #1a2535; color: var(--text3); }
.badge-nodata { background: #1a1a2e; color: #7c6fcd; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }

.days-chip { font-size: 0.68rem; padding: 2px 7px; border-radius: 10px; font-weight: 700; }
.days-red { background:#451a20; color:var(--red); }
.days-orange { background:#44271a; color:var(--orange); }
.days-yellow { background:#3d3d1a; color:var(--yellow); }
.days-green { background:#1c4532; color:var(--green); }

.cat-tag { font-size: 0.63rem; padding: 2px 6px; border-radius: 5px; font-weight: 500; }
.cat-tarjeta { background:#1a2c4e; color:var(--blue); }
.cat-impuesto { background:#2d1a4e; color:#b794f4; }
.cat-servicio { background:#1a3d2d; color:var(--green); }
.cat-honorarios { background:#3d2d1a; color:var(--orange); }
.cat-expensas { background:#3d1a2d; color:#f687b3; }
.cat-salud { background:#1a3d3d; color:#76e4f7; }
.cat-suscripcion { background:#2d3d1a; color:#9ae6b4; }
.cat-cooperativa { background:#3d3d1a; color:var(--yellow); }

/* ── HISTORIAL ── */
.hist-mes { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.hist-mes-header { padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.hist-mes-header:active { background: var(--bg3); }
.hist-mes-title { font-weight: 700; font-size: 0.95rem; }
.hist-mes-total { font-weight: 700; color: var(--blue); font-size: 0.9rem; }
.hist-mes-body { display: none; border-top: 1px solid var(--border); }
.hist-mes-body.open { display: block; }
.hist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 8px; }
.hist-item:last-child { border-bottom: none; }
.hist-item-name { font-size: 0.84rem; font-weight: 500; }
.hist-item-monto { font-size: 0.84rem; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text2); }

/* ── CARGA / NUEVO GASTO ── */
.carga-container { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
.carga-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.carga-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 8px; font-weight: 600; }
.carga-select, .carga-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 12px 14px; font-size: 1rem; outline: none;
  -webkit-appearance: none; font-family: inherit;
}
.carga-select:focus, .carga-input:focus { border-color: var(--blue); }
.carga-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.carga-btn {
  width: 100%; background: linear-gradient(135deg, #2b6cb0, #3182ce);
  border: none; color: #fff; padding: 16px; border-radius: 12px;
  font-size: 1rem; font-weight: 700; cursor: pointer; font-family: inherit;
}
.carga-btn:active { opacity: 0.85; transform: scale(0.98); }
.carga-btn.green { background: linear-gradient(135deg, #276749, #38a169); }
.carga-status { background: var(--bg2); border-radius: 12px; padding: 16px; text-align: center; font-size: 0.95rem; font-weight: 600; display: none; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 500;
  display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0; width: 100%; max-width: 560px;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  padding-bottom: max(20px, var(--safe-bottom));
  max-height: 90vh; overflow-y: auto;
}
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 12px auto 16px; }
.modal-header { padding: 0 20px 14px; border-bottom: 1px solid var(--border); }
.modal-header h3 { font-size: 1rem; font-weight: 700; }
.modal-header p { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }
.modal-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
.modal-ref { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; font-size: 0.82rem; color: var(--text3); }
.modal-ref span { color: var(--blue); font-weight: 600; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-group label { font-size: 0.77rem; color: var(--text2); font-weight: 500; }
.form-group input, .form-group textarea, .form-group select {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); padding: 12px; font-size: 1rem; outline: none; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--blue); }
.form-group textarea { resize: none; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-footer { padding: 12px 20px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
.btn-cancel { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text3); padding: 13px; border-radius: 10px; font-size: 0.9rem; cursor: pointer; font-family: inherit; }
.btn-confirm { flex: 2; background: #276749; border: 1px solid #38a169; color: #f0fff4; padding: 13px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-anular { background: transparent; border: 1px solid #742a2a; color: var(--red); padding: 13px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
.section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text3); font-weight: 600; margin-bottom: 8px; padding: 0 2px; }
.conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.conn-on { background: var(--green); }
.conn-off { background: var(--red); }

/* ── CALENDAR BUTTON ── */
.cal-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border2);
  background: var(--bg); color: var(--text2); font-size: 0.75rem;
  cursor: pointer; font-family: inherit; transition: all 0.15s;
  -webkit-user-select: none; user-select: none;
}
.cal-btn:active { background: var(--bg3); color: var(--text); transform: scale(0.97); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <div class="header-title">Gastos <span>· Tomás Norman</span></div>
    <div class="header-sub" id="header-sub"><span class="conn-dot conn-off" id="conn-dot"></span>Cargando...</div>
  </div>
  <div class="header-emoji">💰</div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- TAB: MES ACTUAL -->
  <div id="tab-mes" class="tab-content active">
    <div id="urgente-banner"></div>
    <div class="summary-grid" id="mes-cards"></div>
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">Pagados este mes</span>
        <span class="progress-label" id="mes-progress-label"></span>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="mes-progress-bar" style="width:0%"></div></div>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="filterCards('all',this)">Todos</button>
      <button class="filter-btn" onclick="filterCards('pendiente',this)">Pendientes</button>
      <button class="filter-btn" onclick="filterCards('pagado',this)">Pagados</button>
      <button class="filter-btn" onclick="filterCards('sin_datos',this)">Sin datos</button>
    </div>
    <div class="expense-list" id="mes-list"></div>
  </div>

  <!-- TAB: HISTORIAL -->
  <div id="tab-historial" class="tab-content">
    <div id="historial-container"></div>
  </div>

  <!-- TAB: CARGAR / NUEVO -->
  <div id="tab-cargar" class="tab-content">
    <div class="carga-container">

      <!-- Editar gasto existente -->
      <div class="carga-card">
        <div class="carga-label">Editar gasto existente</div>
        <select id="carga-gasto" class="carga-select">
          <option value="">— Elegí un gasto —</option>
        </select>
      </div>
      <div class="carga-card">
        <div class="carga-grid">
          <div>
            <div class="carga-label">Monto total ($)</div>
            <input type="number" id="carga-monto" class="carga-input" placeholder="Ej: 244709" inputmode="numeric" />
          </div>
          <div>
            <div class="carga-label">Vencimiento</div>
            <input type="date" id="carga-vencimiento" class="carga-input" />
          </div>
        </div>
      </div>
      <div class="carga-card">
        <div class="carga-label">Notas</div>
        <input type="text" id="carga-notas" class="carga-input" placeholder="Ej: Pago mínimo $77.454" />
      </div>
      <button class="carga-btn green" onclick="guardarEdicion()">💾 Guardar cambios</button>

      <hr style="border:none;border-top:1px solid var(--border);margin:8px 0;">

      <!-- Nuevo gasto -->
      <div class="section-title" style="padding:0;">+ Agregar gasto nuevo</div>
      <div class="carga-card">
        <div class="carga-grid">
          <div>
            <div class="carga-label">Nombre</div>
            <input type="text" id="nuevo-nombre" class="carga-input" placeholder="Ej: Internet Claro" />
          </div>
          <div>
            <div class="carga-label">Categoría</div>
            <select id="nuevo-categoria" class="carga-select">
              <option value="servicio">Servicio</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="impuesto">Impuesto</option>
              <option value="honorarios">Honorarios</option>
              <option value="expensas">Expensas</option>
              <option value="salud">Salud</option>
              <option value="suscripcion">Suscripción</option>
              <option value="cooperativa">Cooperativa</option>
            </select>
          </div>
        </div>
      </div>
      <div class="carga-card">
        <div class="carga-grid">
          <div>
            <div class="carga-label">Persona</div>
            <select id="nuevo-persona" class="carga-select">
              <option value="Tomás">Tomás</option>
              <option value="Joana">Joana</option>
            </select>
          </div>
          <div>
            <div class="carga-label">Monto ($)</div>
            <input type="number" id="nuevo-monto" class="carga-input" placeholder="Opcional" inputmode="numeric" />
          </div>
        </div>
      </div>
      <div class="carga-card">
        <div class="carga-label">Vencimiento</div>
        <input type="date" id="nuevo-vencimiento" class="carga-input" />
      </div>
      <div class="carga-card">
        <div class="carga-label">Notas</div>
        <input type="text" id="nuevo-notas" class="carga-input" placeholder="Ej: Fibra 300Mbps" />
      </div>
      <button class="carga-btn" onclick="crearNuevoGasto()">➕ Crear nuevo gasto</button>

      <div id="carga-status" class="carga-status"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="nav-mes" onclick="showTab('mes',this)">
    <span class="nav-icon">🔴</span><span id="nav-mes-label">Mes</span>
  </button>
  <button class="nav-item" id="nav-historial" onclick="showTab('historial',this)">
    <span class="nav-icon">📊</span>Historial
  </button>
  <button class="nav-item" id="nav-cargar" onclick="showTab('cargar',this)">
    <span class="nav-icon">✏️</span>Editar
  </button>
</nav>

<!-- MODAL EDITAR (bottom sheet) -->
<div class="modal-overlay hidden" id="modal-editar" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-titulo">Editar gasto</h3>
      <p id="modal-subtitulo"></p>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Monto facturado ($)</label>
          <input type="number" id="modal-monto" placeholder="Ej: 244709" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label>Pago mínimo ($)</label>
          <input type="number" id="modal-minimo" placeholder="Opcional" inputmode="numeric" />
        </div>
      </div>
      <div class="form-group">
        <label>Vencimiento</label>
        <input type="date" id="modal-vencimiento" />
      </div>
      <div class="form-group">
        <label>Notas</label>
        <textarea id="modal-notas" placeholder="Detalles..."></textarea>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:4px 0;">
      <div class="section-title">Pago</div>

      <div class="form-row">
        <div class="form-group">
          <label>¿Pagado?</label>
          <select id="modal-pagado">
            <option value="false">No</option>
            <option value="true">Sí</option>
          </select>
        </div>
        <div class="form-group">
          <label>Fecha de pago</label>
          <input type="date" id="modal-pagado-fecha" />
        </div>
      </div>
      <div class="form-group">
        <label>Monto pagado ($)</label>
        <input type="number" id="modal-pagado-monto" placeholder="0" inputmode="numeric" />
      </div>
      <button class="cal-btn" id="btn-calendar" style="width:100%;justify-content:center;margin-top:4px;" onclick="calendarFromModal()">📅 Agregar al calendario</button>
    </div>
    <div class="modal-footer">
      <button class="btn-anular" id="btn-anular" onclick="anularPago()" style="display:none;">✕ Anular</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" onclick="confirmEditar()">✓ Guardar</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──
let GASTOS_DATA = null;
let CONFIG_DATA = null;
let API_AVAILABLE = false;
let currentFilter = 'all';
let editMes = null, editId = null;

const API_BASE = '';
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// ── SHA CACHE ──
// Guardamos el SHA después de cada GET/PUT para evitar conflictos 409
const shaCache = {};

function ensureToken(forcePrompt) {
  if (!forcePrompt) {
    let t = localStorage.getItem('gh_token');
    if (t) return t;
  }
  // Pedir token nuevo
  const msg = forcePrompt
    ? 'El token actual no funciona (401). Ingresá un nuevo GitHub token (ghp_...):\n\nSi no tenés uno, andá a: github.com/settings/tokens → Generate new token (classic) → marcá "repo" → Create token'
    : 'Ingresá tu GitHub token (ghp_...) para guardar cambios:\n\nSi no tenés uno, andá a: github.com/settings/tokens → Generate new token (classic) → marcá "repo" → Create token';
  const t = prompt(msg);
  if (t) {
    localStorage.setItem('gh_token', t.trim());
    return t.trim();
  }
  return null;
}

function clearBadToken() {
  localStorage.removeItem('gh_token');
}

function todayStr() { return new Date().toISOString().split('T')[0]; }
function currentMonthKey() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function nextMonthKey() { const d=new Date(); d.setMonth(d.getMonth()+1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }

// ── GITHUB API ──
const GH_REPO = '70miboy/gastos-mensuales';
const GH_FILE = 'gastos.json';
const GH_CONFIG = 'config.json';

function ghToken() { return localStorage.getItem('gh_token'); }

async function ghGet(file) {
  let t = ghToken();
  if (!t) { t = ensureToken(); if (!t) throw new Error('Sin token de GitHub'); }
  const r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}`, {
    headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  if(r.status === 401 || r.status === 403) {
    // Token inválido — limpiar y pedir nuevo
    clearBadToken();
    t = ensureToken(true);
    if (!t) throw new Error('Necesitás un token de GitHub válido para guardar cambios');
    const r2 = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}`, {
      headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(!r2.ok) throw new Error(`GitHub GET ${file}: ${r2.status} ${r2.statusText}`);
    const j2 = await r2.json();
    shaCache[file] = j2.sha;
    return { content: JSON.parse(atob(j2.content.replace(/\n/g,''))), sha: j2.sha };
  }
  if(!r.ok) throw new Error(`GitHub GET ${file}: ${r.status} ${r.statusText}`);
  const j = await r.json();
  shaCache[file] = j.sha;
  return { content: JSON.parse(atob(j.content.replace(/\n/g,''))), sha: j.sha };
}

async function ghPut(file, content, sha, msg, retries) {
  retries = retries || 2;
  let t = ghToken();
  if (!t) { t = ensureToken(); if (!t) throw new Error('Sin token de GitHub'); }
  const body = JSON.stringify({
    message: msg || 'Update',
    content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))),
    sha: sha || shaCache[file] || undefined
  });
  let r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}`, {
    method: 'PUT', headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
    body: body
  });
  // Token inválido — pedir nuevo y reintentar
  if(r.status === 401 || r.status === 403) {
    clearBadToken();
    t = ensureToken(true);
    if (!t) throw new Error('Necesitás un token de GitHub válido');
    r = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${file}`, {
      method: 'PUT', headers: { 'Authorization': `token ${t}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: body
    });
    if(!r.ok) throw new Error(`Error al guardar (${r.status}): ${r.statusText}`);
  }
  if(!r.ok) {
    if(r.status === 409 && retries > 0) {
      console.warn(`SHA conflict en ${file}, reintentando...`);
      const fresh = await ghGet(file);
      // Re-aplicar cambios sobre datos frescos
      Object.assign(content.pagos, content.pagos); // merge conceptual
      await ghPut(file, content, fresh.sha, msg, retries - 1);
      return;
    }
    const errBody = await r.text().catch(() => '');
    throw new Error(`Error al guardar en GitHub (${r.status}): ${errBody || r.statusText}`);
  }
  const result = await r.json();
  shaCache[file] = result.content.sha;
  return result;
}

async function apiGet(p) {
  try { const r=await fetch(API_BASE+p); if(r.ok) { API_AVAILABLE=true; return r.json(); } } catch(e){}
  // Fallback: GitHub API
  if(p==='/api/gastos') return (await ghGet(GH_FILE)).content;
  if(p==='/api/config') return (await ghGet(GH_CONFIG)).content;
  throw new Error('No API');
}

async function apiPatch(mes,id,d) {
  // Siempre usar GitHub API (no hay API local)
  const {content, sha} = await ghGet(GH_FILE);
  if(!content.pagos[mes]) content.pagos[mes] = {};
  if(!content.pagos[mes][id]) content.pagos[mes][id] = {};
  Object.assign(content.pagos[mes][id], d);
  content.ultima_actualizacion = todayStr();
  await ghPut(GH_FILE, content, sha, `Editar ${id} ${mes}`);
  // Actualizar datos locales con lo que acabamos de guardar
  GASTOS_DATA = content;
  return content;
}

async function apiPost(p,d) {
  // Crear nuevo gasto via GitHub
  if(p==='/api/gasto-nuevo') {
    const {content: gastos, sha: gsha} = await ghGet(GH_FILE);
    const {content: config, sha: csha} = await ghGet(GH_CONFIG);
    const id = d.id;
    // Add to config
    config.gastos_recurrentes.push({id,nombre:d.nombre,categoria:d.categoria==='tarjeta'?'tarjeta_credito':d.categoria,persona:d.persona,gmail_busqueda:[d.nombre],dia_vencimiento_aprox:null,activo:true});
    await ghPut(GH_CONFIG, config, csha, `Agregar gasto: ${d.nombre}`);
    // Add to gastos.json current month
    const cur = currentMonthKey();
    if(!gastos.pagos[cur]) gastos.pagos[cur] = {};
    gastos.pagos[cur][id] = {vencimiento:d.vencimiento||null,monto:d.monto||null,pagado:false,pagado_fecha:null,pagado_monto:null,fuente:'carga_manual',notas:d.notas||''};
    gastos.ultima_actualizacion = todayStr();
    await ghPut(GH_FILE, gastos, gsha, `Crear gasto: ${d.nombre}`);
    // Actualizar datos locales
    GASTOS_DATA = gastos;
    CONFIG_DATA = config;
    return gastos;
  }
  throw new Error('Operación no soportada');
}

// ── FORMAT ──
function fmt(n) { if(!n)return null; return '$\u00a0'+Math.round(n).toLocaleString('es-AR'); }
function fmtDate(s) { if(!s)return null; const[y,m,d]=s.split('-'); return `${d}/${m}`; }
function fmtMonth(k) { const[y,m]=k.split('-'); const n=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return `${n[parseInt(m)]} ${y}`; }
function fmtMonthFull(k) { const[y,m]=k.split('-'); const n=['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; return `${n[parseInt(m)]} ${y}`; }
function daysUntil(s) { if(!s)return null; return Math.round((new Date(s+'T00:00:00')-TODAY)/86400000); }

// ── CLICK vs SELECCIÓN ──
// Evitar que seleccionar texto abra el modal
function cardClick(mes, id) {

  if (sel && sel.toString().trim().length > 0) return; // Está seleccionando texto
  openModal(mes, id);
}

// ── CALENDARIO ──
function addToCalendar(nombre, persona, vencimiento, monto, notas) {
  if(!vencimiento) { alert('Este gasto no tiene fecha de vencimiento'); return; }
  // Fecha a las 8:00 AM (no 00:00 para no molestar)
  const d = new Date(vencimiento + 'T08:00:00');
  const end = new Date(d.getTime() + 30*60000); // 30 min
  const fmtGCal = (dt) => dt.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const text = encodeURIComponent(`💰 ${nombre}`);
  const details = encodeURIComponent(`Persona: ${persona}${monto ? '\nMonto: $' + Math.round(monto).toLocaleString('es-AR') : ''}${notas ? '\n' + notas : ''}`);
  const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${fmtGCal(d)}/${fmtGCal(end)}&details=${details}&location=&sf=true&output=xml`;
  window.open(url, '_blank');
}

function calendarFromModal() {
  if(!editId) return;
  const cfg = getConfigGastos().find(g=>g.id===editId)||{nombre:editId,persona:'?'};
  const venc = document.getElementById('modal-vencimiento').value || null;
  const monto = document.getElementById('modal-monto').value ? parseFloat(document.getElementById('modal-monto').value) : null;
  const notas = document.getElementById('modal-notas').value || null;
  addToCalendar(cfg.nombre, cfg.persona, venc, monto, notas);
}

function getDaysBadge(days,paid) {
  if(paid)return `<span class="days-chip days-green">✓</span>`;
  if(days===null)return '';
  if(days<0)return `<span class="days-chip days-red">${Math.abs(days)}d</span>`;
  if(days===0)return `<span class="days-chip days-red">HOY</span>`;
  if(days===1)return `<span class="days-chip days-red">MAÑANA</span>`;
  if(days<=3)return `<span class="days-chip days-orange">${days}d</span>`;
  if(days<=10)return `<span class="days-chip days-yellow">${days}d</span>`;
  return `<span class="days-chip days-green">${days}d</span>`;
}
function getStatusBadge(p) {
  if(p.pagado===true)return `<span class="badge badge-paid">✓ Pagado</span>`;
  if(!p.vencimiento&&!p.monto)return `<span class="badge badge-nodata">? Sin datos</span>`;
  const d=daysUntil(p.vencimiento);
  if(d!==null&&d<0)return `<span class="badge badge-overdue">⚠ Vencido</span>`;
  if(d!==null&&d<=1)return `<span class="badge badge-urgent">🔴 Urgente</span>`;
  if(d!==null&&d<=5)return `<span class="badge badge-urgent">🟠 Próximo</span>`;
  if(d!==null&&d<=10)return `<span class="badge badge-soon">🟡 Semana</span>`;
  return `<span class="badge badge-pending">● Pendiente</span>`;
}
function getCatTag(cat) {
  const L={tarjeta:'Tarjeta',impuesto:'Impuesto',servicio:'Servicio',honorarios:'Honorarios',expensas:'Expensas',salud:'Salud',suscripcion:'Suscripción',cooperativa:'Cooperativa'};
  return `<span class="cat-tag cat-${cat}">${L[cat]||cat}</span>`;
}
function getGroup(p) {
  if(p.pagado===true)return 'pagado';
  if(!p.vencimiento&&!p.monto)return 'sin_datos';
  return 'pendiente';
}

function getPago(mes,id) {
  if(GASTOS_DATA&&GASTOS_DATA.pagos[mes]&&GASTOS_DATA.pagos[mes][id]) return {...GASTOS_DATA.pagos[mes][id]};
  return {vencimiento:null,monto:null,pagado:false,pagado_fecha:null,pagado_monto:null,notas:'',fuente:null};
}

// ── RENDER ──
function renderCards() {
  const mesKey = currentMonthKey();
  const list = document.getElementById('mes-list');
  if(!list||!GASTOS_DATA) return;

  const gastos = getConfigGastos();
  let totalKnown=0,totalPaid=0,countPaid=0,countPending=0,countNoData=0;

  const sorted = [...gastos].sort((a,b)=>{
    const pa=getPago(mesKey,a.id),pb=getPago(mesKey,b.id);
    if(pa.pagado===true&&pb.pagado!==true)return 1;
    if(pa.pagado!==true&&pb.pagado===true)return -1;
    const da=daysUntil(pa.vencimiento),db=daysUntil(pb.vencimiento);
    if(da===null&&db===null)return 0;
    if(da===null)return 1; if(db===null)return -1;
    return da-db;
  });

  list.innerHTML = sorted.map(g=>{
    const p=getPago(mesKey,g.id);
    const group=getGroup(p);
    if(currentFilter!=='all'&&group!==currentFilter)return '';
    if(p.monto)totalKnown+=p.monto;
    if(p.pagado===true){totalPaid+=(p.pagado_monto||p.monto||0);countPaid++;}
    else if(group==='sin_datos')countNoData++;
    else countPending++;

    const days=daysUntil(p.vencimiento);
    const isUrgent=days!==null&&days<=2&&p.pagado!==true;
    const isPaid=p.pagado===true;

    return `<div class="expense-card${isUrgent?' urgent':''}${isPaid?' paid':''}" onclick="cardClick('${mesKey}','${g.id}')">
      <div class="expense-card-top">
        <div>
          <div class="expense-name">${g.nombre}</div>
          <div class="expense-persona">${g.persona} · ${getCatTag(g.cat)}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">
          ${getStatusBadge(p)}
          ${getDaysBadge(days,isPaid)}
        </div>
      </div>
      <div class="expense-card-mid">
        <div class="${p.monto?'expense-monto':'expense-monto unknown'}">${p.monto?fmt(p.monto):'Tocá para agregar monto'}</div>
        <div class="expense-vence${isUrgent?' urgent':''}">${p.vencimiento?'Vence '+fmtDate(p.vencimiento):isPaid&&p.pagado_fecha?'Pagado '+fmtDate(p.pagado_fecha):''}</div>
      </div>
      ${p.notas?`<div class="expense-notas">${p.notas}</div>`:''}
      ${p.vencimiento&&p.pagado!==true?`<div style="margin-top:8px;display:flex;gap:8px;">
        <button class="cal-btn" onclick="event.stopPropagation();addToCalendar('${g.nombre.replace(/'/g,"\\'")}','${g.persona}','${p.vencimiento}',${p.monto||'null'},${p.notas?`'${p.notas.replace(/'/g,"\\'").replace(/\n/g,' ')}'`:'null'})">📅 Agregar al calendario</button>
      </div>`:''}
    </div>`;
  }).join('');

  // Summary
  const pct=totalKnown>0?Math.round((totalPaid/totalKnown)*100):0;
  document.getElementById('mes-cards').innerHTML=`
    <div class="sum-card"><div class="sum-label">Total conocido</div><div class="sum-value blue">${fmt(totalKnown)||'—'}</div><div class="sum-sub">${gastos.filter(g=>getPago(mesKey,g.id).monto).length} ítems</div></div>
    <div class="sum-card"><div class="sum-label">Pagado</div><div class="sum-value green">${fmt(totalPaid)||'$0'}</div><div class="sum-sub">${countPaid} ok</div></div>
    <div class="sum-card"><div class="sum-label">Pendiente</div><div class="sum-value red">${totalKnown>totalPaid?fmt(totalKnown-totalPaid):'—'}</div><div class="sum-sub">${countPending} pend.</div></div>
    <div class="sum-card"><div class="sum-label">Sin datos</div><div class="sum-value yellow">${countNoData}</div><div class="sum-sub">sin info</div></div>
  `;
  document.getElementById('mes-progress-bar').style.width=pct+'%';
  document.getElementById('mes-progress-label').textContent=`${countPaid}/${gastos.length} · ${pct}%`;

  // Urgent banner
  const urgentes=sorted.filter(g=>{const p=getPago(mesKey,g.id);const d=daysUntil(p.vencimiento);return d!==null&&d<=3&&p.pagado!==true;});
  const banner=document.getElementById('urgente-banner');
  if(urgentes.length>0){
    banner.innerHTML=`<div class="alert">🚨 <div><strong>URGENTE:</strong> ${urgentes.map(g=>{const p=getPago(mesKey,g.id);const d=daysUntil(p.vencimiento);return `${g.nombre}${p.monto?' '+fmt(p.monto):''}${d===0?' HOY':d===1?' MAÑANA':' en '+d+'d'}`;}).join(' · ')}</div></div>`;
  } else { banner.innerHTML=''; }

  // Nav label
  document.getElementById('nav-mes-label').textContent = fmtMonth(mesKey);
}

function renderHistorial() {
  if(!GASTOS_DATA) return;
  const cur=currentMonthKey();
  const container=document.getElementById('historial-container');
  const months=Object.keys(GASTOS_DATA.pagos).sort().reverse().filter(m=>m<cur);
  const gastos=getConfigGastos();

  container.innerHTML=months.map(mes=>{
    const data=GASTOS_DATA.pagos[mes];
    const total=Object.values(data).reduce((s,p)=>s+(p.monto||0),0);
    const items=gastos.map(g=>{
      const p=data[g.id]; if(!p||(!p.monto&&!p.vencimiento&&!p.notas))return '';
      return `<div class="hist-item">
        <div><div class="hist-item-name">${g.nombre}</div><div style="font-size:0.68rem;color:var(--text3);margin-top:2px;">${getCatTag(g.cat)}</div></div>
        <div style="text-align:right;">
          <div class="hist-item-monto">${p.monto?fmt(p.monto):'—'}</div>
          <div style="font-size:0.68rem;color:var(--text3);">${fmtDate(p.vencimiento)||''}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="hist-mes">
      <div class="hist-mes-header" onclick="this.nextElementSibling.classList.toggle('open')">
        <span class="hist-mes-title">${fmtMonthFull(mes)}</span>
        <span class="hist-mes-total">${total>0?fmt(total):'Parcial'} ▾</span>
      </div>
      <div class="hist-mes-body">${items||'<div style="padding:16px;color:var(--text4);">Sin datos</div>'}</div>
    </div>`;
  }).join('')||'<div style="color:var(--text4);text-align:center;padding:40px;">No hay historial.</div>';
}

  document.getElementById('modal-vencimiento').value=p.vencimiento||'';

function closeModal() { document.getElementById('modal-editar').classList.add('hidden'); editMes=null; editId=null; }

async function confirmEditar() {
  if(!editMes||!editId) return;
  const data = {
    monto: document.getElementById('modal-monto').value ? parseFloat(document.getElementById('modal-monto').value) : null,
    pago_minimo: document.getElementById('modal-minimo').value ? parseFloat(document.getElementById('modal-minimo').value) : null,
    vencimiento: document.getElementById('modal-vencimiento').value || null,
    notas: document.getElementById('modal-notas').value || null,
    pagado: document.getElementById('modal-pagado').value === 'true',
    pagado_fecha: document.getElementById('modal-pagado-fecha').value || null,
    pagado_monto: document.getElementById('modal-pagado-monto').value ? parseFloat(document.getElementById('modal-pagado-monto').value) : null,
  };
  Object.keys(data).forEach(k=>{if(data[k]===null||data[k]===undefined||data[k]==='')delete data[k];});

  try {
    await apiPatch(editMes,editId,data);
    // No hace falta Object.assign local — apiPatch ya actualiza GASTOS_DATA
    closeModal();
    renderCards();
    renderHistorial();
    initCargaSelect();
    alert('✅ Guardado en GitHub');
  } catch(e) { alert('❌ Error al guardar: '+e.message); }
}

async function anularPago() {
  if(!editMes||!editId) return;
  if(!confirm('¿Anular el pago?')) return;
  const data={pagado:false,pagado_fecha:null,pagado_monto:null};
  try {
    await apiPatch(editMes,editId,data);
    // GASTOS_DATA ya actualizado por apiPatch
    closeModal(); renderCards(); renderHistorial();
    alert('✅ Pago anulado en GitHub');
  } catch(e) { alert('❌ Error: '+e.message); }
}

  const venc=document.getElementById('carga-vencimiento').value;
  const notas=document.getElementById('carga-notas').value;
  if(!id){alert('Elegí un gasto');return;}
  if(!monto&&!venc&&!notas){alert('Ingresá al menos un dato');return;}

  const mesKey=currentMonthKey();
  const data={};
  if(monto) data.monto=parseFloat(monto);
  if(venc) data.vencimiento=venc;
  if(notas) data.notas=notas;

  showStatus('⏳ Guardando...','var(--blue)');
  try {
    await apiPatch(mesKey,id,data);
    // GASTOS_DATA ya actualizado por apiPatch
    showStatus('✅ ¡Guardado en GitHub!','var(--green)');
    ['carga-gasto','carga-monto','carga-vencimiento','carga-notas'].forEach(x=>document.getElementById(x).value='');
    renderCards(); renderHistorial();
  } catch(e) { showStatus('❌ Error: '+e.message,'var(--red)'); }
}

// ── CARGA TAB: nuevo gasto ──
async function crearNuevoGasto() {
  const nombre=document.getElementById('nuevo-nombre').value.trim();
  const cat=document.getElementById('nuevo-categoria').value;
  const persona=document.getElementById('nuevo-persona').value;
  const monto=document.getElementById('nuevo-monto').value?parseFloat(document.getElementById('nuevo-monto').value):null;
  const venc=document.getElementById('nuevo-vencimiento').value||null;
  const notas=document.getElementById('nuevo-notas').value.trim()||null;

  if(!nombre){alert('Ingresá el nombre');return;}

  const id=nombre.toLowerCase().replace(/[^a-z0-9áéíóúñ]/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
  const existing=getConfigGastos().find(g=>g.id===id);
  if(existing){alert(`Ya existe "${existing.nombre}"`);return;}

  showStatus('⏳ Creando...','var(--blue)');
  try {
    await apiPost('/api/gasto-nuevo',{id,nombre,categoria:cat,persona,monto,vencimiento:venc,notas});
    // GASTOS_DATA y CONFIG_DATA ya actualizados por apiPost
    const nxt=nextMonthKey();
    if(!GASTOS_DATA.pagos[nxt])GASTOS_DATA.pagos[nxt]={};
    showStatus('✅ ¡Creado en GitHub!','var(--green)');
    ['nuevo-nombre','nuevo-monto','nuevo-vencimiento','nuevo-notas'].forEach(x=>document.getElementById(x).value='');
    initCargaSelect();
    renderCards(); renderHistorial();
  } catch(e) { showStatus('❌ Error: '+e.message,'var(--red)'); }
}

function showStatus(msg,color) {
  const el=document.getElementById('carga-status');
  el.style.display='block'; el.style.color=color||'var(--text)'; el.textContent=msg;
  setTimeout(()=>{el.style.display='none';},4000);
}

// ── DATA LOAD ──
async function loadData() {
  try {
    // Intentar con API local
    const [gastos,config]=await Promise.all([apiGet('/api/gastos'),apiGet('/api/config')]);
    GASTOS_DATA=gastos; CONFIG_DATA=config; API_AVAILABLE=true;
    document.getElementById('conn-dot').className='conn-dot conn-on';
    const upd=gastos.ultima_actualizacion;
    document.getElementById('header-sub').innerHTML=`<span class="conn-dot conn-on"></span>${upd?'Actualizado: '+upd.split('-').reverse().join('/'):'Datos en vivo'}`;
  } catch(e) {
    // Fallback: GitHub API direct
    try {
      ensureToken();
      const gastos = (await ghGet(GH_FILE)).content;
      const config = (await ghGet(GH_CONFIG)).content;
      GASTOS_DATA=gastos; CONFIG_DATA=config; API_AVAILABLE=false;
      document.getElementById('conn-dot').className='conn-dot conn-on';
      const upd=gastos.ultima_actualizacion;
      document.getElementById('header-sub').innerHTML=`<span class="conn-dot conn-on"></span>GitHub · ${upd?upd.split('-').reverse().join('/'):'Sin fecha'}`;
    } catch(e2) {
      // Último fallback: archivos estáticos
      try {
        const [gastos,config]=await Promise.all([fetch('gastos.json').then(r=>r.json()),fetch('config.json').then(r=>r.json())]);
        GASTOS_DATA=gastos; CONFIG_DATA=config; API_AVAILABLE=false;
        document.getElementById('conn-dot').className='conn-dot conn-on';
        const upd=gastos.ultima_actualizacion;
        document.getElementById('header-sub').innerHTML=`<span class="conn-dot conn-on"></span>Estático · ${upd?upd.split('-').reverse().join('/'):'Sin fecha'}`;
      } catch(e3) {
        document.getElementById('conn-dot').className='conn-dot conn-off';
        document.getElementById('header-sub').innerHTML=`<span class="conn-dot conn-off"></span>Sin conexión`;
        GASTOS_DATA={pagos:{},ultima_actualizacion:null};
        CONFIG_DATA={gastos_recurrentes:[]};
      }
    }
  }
  renderCards();
  renderHistorial();
  initCargaSelect();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

loadData();
</script>
